        /* ===== ТЁМНАЯ ТЕМА ===== */
        :root {

            --dark-chocolate: #3D1F12;
            --walnut-brown: #584738;
            --sand-beige: #98755B;
            --cream-ivory: #F1EADA;
            --pure-white: #FFFFFF;
            --gold: #D4AF37;
            --light-gold: #F4E4A6;
            --dark-beige: #D8C9B0;
            --warm-gray: #A99E8B;
            
            /* Переменные */
            --bg-primary: #2A1A0F;
            --bg-card: rgba(30, 23, 18, 0.85);
            --text-primary: var(--light-gold);
            --text-secondary: rgba(244, 228, 166, 0.9);
            --border-color: rgba(212, 175, 55, 0.25);
            --button-bg: linear-gradient(135deg, 
                rgba(61, 31, 18, 0.9) 0%, 
                rgba(88, 71, 56, 0.9) 100%);
            --button-text: var(--light-gold);
            --accent-color: var(--pure-white);
            --title-color: var(--light-gold);
            --line-color: linear-gradient(90deg, 
                transparent, 
                var(--gold), 
                var(--light-gold), 
                var(--gold), 
                transparent);
            --veins-gold: rgba(212, 175, 55, 0.08);
            --veins-light-gold: rgba(244, 228, 166, 0.15);
            --icon-color: var(--light-gold);
        }
        
        /* ===== СВЕТЛАЯ ТЕМА ===== */
        .light-theme {
            /* Цвета */
            --chocolate: #684627;
            --roasted-peach: #E8A895;
            --whole-wheat: #EFD2B0;
            --milky-coffee: #B59272;
            --cream: #FFE4B8;
            --peony-pink: #E8A8B8;
            --peony-dark-pink: #C97A8D;
            
            /* Переменные */
            --bg-primary: #FFF8ED;
            --bg-card: rgba(255, 252, 245, 0.95);
            --text-primary: #5C4A36;
            --text-secondary: #7D6B57;
            --border-color: #684627;
            --button-bg: linear-gradient(135deg, 
                var(--roasted-peach) 0%,     
                var(--whole-wheat) 100%);
            --button-text: #684627;
            --accent-color: #7D6B57;
            --title-color: #684627;
            --line-color: linear-gradient(90deg, 
                var(--milky-coffee), 
                var(--chocolate), 
                var(--milky-coffee));
            --veins-chocolate: rgba(104, 70, 39, 0.15);
            --veins-coffee: rgba(181, 146, 114, 0.12);
            --icon-color: #5C4A36;
        }
        
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        /* ===== ФОНЫ С ПРОЖИЛКАМИ ===== */
        .theme-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            transition: none !important;
        }
        
        .theme-bg:not(.active) {
            display: none;
        }
        
        .theme-bg.dark {
            background: #2A1A0F;
        }
        
        .theme-bg.dark::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(65deg, 
                    transparent 28%,
                    var(--veins-gold) 29%,
                    var(--veins-light-gold) 32%,
                    var(--veins-gold) 35%,
                    transparent 36%),
                linear-gradient(-75deg, 
                    transparent 62%,
                    var(--veins-gold) 63%,
                    var(--veins-light-gold) 65%,
                    var(--veins-gold) 67%,
                    transparent 68%),
                linear-gradient(40deg, 
                    transparent 15%,
                    var(--veins-light-gold) 16%,
                    transparent 17%,
                    transparent 45%,
                    var(--veins-gold) 46%,
                    transparent 47%),
                linear-gradient(85deg, 
                    transparent 5%,
                    var(--veins-gold) 6%,
                    transparent 7%,
                    transparent 25%,
                    var(--veins-light-gold) 26%,
                    transparent 27%),
                linear-gradient(110deg, 
                    transparent 40%,
                    var(--veins-light-gold) 41%,
                    transparent 42%);
            mix-blend-mode: screen;
            opacity: 0.6;
        }
        
        .theme-bg.dark::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(115deg, 
                    transparent 28%,
                    var(--veins-gold) 29%,
                    var(--veins-light-gold) 32%,
                    var(--veins-gold) 35%,
                    transparent 36%),
                linear-gradient(-45deg, 
                    transparent 62%,
                    var(--veins-gold) 63%,
                    var(--veins-light-gold) 65%,
                    var(--veins-gold) 67%,
                    transparent 68%),
                linear-gradient(140deg, 
                    transparent 15%,
                    var(--veins-light-gold) 16%,
                    transparent 17%,
                    transparent 45%,
                    var(--veins-gold) 46%,
                    transparent 47%),
                linear-gradient(95deg, 
                    transparent 75%,
                    var(--veins-gold) 76%,
                    transparent 77%,
                    transparent 85%,
                    var(--veins-light-gold) 86%,
                    transparent 87%),
                linear-gradient(70deg, 
                    transparent 60%,
                    var(--veins-light-gold) 61%,
                    transparent 62%);
            mix-blend-mode: screen;
            opacity: 0.6;
        }
        
        .theme-bg.light {
            background: #FFF8ED;
        }
        
        .theme-bg.light::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(65deg, 
                    transparent 28%,
                    var(--veins-chocolate) 29%,
                    rgba(104, 70, 39, 0.25) 32%,
                    var(--veins-chocolate) 35%,
                    transparent 36%),
                linear-gradient(-75deg, 
                    transparent 62%,
                    var(--veins-chocolate) 63%,
                    rgba(104, 70, 39, 0.22) 65%,
                    var(--veins-chocolate) 67%,
                    transparent 68%),
                linear-gradient(40deg, 
                    transparent 15%,
                    var(--veins-coffee) 16%,
                    transparent 17%,
                    transparent 45%,
                    rgba(181, 146, 114, 0.14) 46%,
                    transparent 47%),
                linear-gradient(85deg, 
                    transparent 5%,
                    var(--veins-chocolate) 6%,
                    transparent 7%,
                    transparent 25%,
                    var(--veins-coffee) 26%,
                    transparent 27%),
                linear-gradient(110deg, 
                    transparent 40%,
                    var(--veins-coffee) 41%,
                    transparent 42%);
            mix-blend-mode: multiply;
            opacity: 0.8;
            filter: blur(0.4px);
        }
        
        .theme-bg.light::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(115deg, 
                    transparent 28%,
                    var(--veins-chocolate) 29%,
                    rgba(104, 70, 39, 0.25) 32%,
                    var(--veins-chocolate) 35%,
                    transparent 36%),
                linear-gradient(-45deg, 
                    transparent 62%,
                    var(--veins-chocolate) 63%,
                    rgba(104, 70, 39, 0.22) 65%,
                    var(--veins-chocolate) 67%,
                    transparent 68%),
                linear-gradient(140deg, 
                    transparent 15%,
                    var(--veins-coffee) 16%,
                    transparent 17%,
                    transparent 45%,
                    rgba(181, 146, 114, 0.14) 46%,
                    transparent 47%),
                linear-gradient(95deg, 
                    transparent 75%,
                    var(--veins-chocolate) 76%,
                    transparent 77%,
                    transparent 85%,
                    var(--veins-coffee) 86%,
                    transparent 87%),
                linear-gradient(70deg, 
                    transparent 60%,
                    var(--veins-coffee) 61%,
                    transparent 62%);

            opacity: 0.8;
            filter: blur(0.4px);
        }
        
        /* ===== ОСНОВНОЙ КОНТЕЙНЕР ===== */
        .app-container {
            width: 100%;
            max-width: 400px;
            height: 90vh;
            max-height: 700px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        
        /* ===== ЭКРАН ЗАГРУЗКИ ===== */
        .loading-card {
            flex: 1;
            background: var(--bg-card);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.4),
                0 0 0 1px var(--border-color),
                0 0 40px rgba(212, 175, 55, 0.1) inset;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(15px) saturate(180%);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 25px;
        }
        
        @keyframes petalClose {
            0% {
                opacity: 1;
                transform: rotate(var(--rotate-end)) translateY(0) scale(1);
            }
            30% {
                opacity: 1;
                transform: rotate(calc(var(--rotate-end) + 5deg)) translateY(-10px) scale(1.05);
            }
            100% {
                opacity: 0;
                transform: rotate(calc(var(--rotate-end) + 10deg)) translateY(20px) scale(0.3);
            }
        }
        
        @keyframes centerClose {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0);
            }
        }
        
        .loading-card::before {
            content: '';
            position: absolute;
            top: 1px;
            left: 1px;
            right: 1px;
            bottom: 1px;
            border-radius: 23px;
            border: 1px solid transparent;
            background: linear-gradient(135deg, 
                var(--veins-gold), 
                var(--veins-light-gold),
                var(--veins-gold)) border-box;
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            pointer-events: none;
        }
        
        .light-theme .loading-card::before {
            background: linear-gradient(135deg, 
                var(--veins-chocolate), 
                var(--veins-coffee),
                var(--veins-chocolate)) border-box;
        }
        
        .flower-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
            padding-top: 40px;
        }
        
        .peony-container {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .peony {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .peony-petal {
            position: absolute;
            width: 32px;
            height: 55px;
            background: var(--gold);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            transform-origin: center 1px;
            opacity: 0;
            box-shadow: 
                inset 0 0 10px var(--light-gold),
                0 2px 8px rgba(0, 0, 0, 0.2),
                0 0 0 1px rgba(42, 26, 15, 0.4);
            border: 1px solid rgba(30, 23, 18, 0.6);
        }
        
        .light-theme .peony-petal {
            background: var(--roasted-peach);
            box-shadow: 
                inset 0 0 10px rgba(255, 255, 255, 0.6),
                0 2px 8px rgba(0, 0, 0, 0.1),
                0 0 0 1px var(--chocolate);
            border: 1px solid var(--chocolate);
        }
        
        .peony-center {
            position: absolute;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle at 30% 30%, var(--light-gold), var(--gold));
            border-radius: 50%;
            z-index: 10;
            box-shadow: 
                inset 0 0 5px var(--light-gold),
                0 0 8px var(--gold);
            top: 28%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
        }
        
        .light-theme .peony-center {
            background: radial-gradient(circle at 30% 30%, var(--cream), var(--chocolate));
            box-shadow: 
                inset 0 0 5px var(--cream),
                0 0 8px var(--chocolate);
        }
        
        .progress-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
            padding-bottom: 30px;
        }
        
        .loading-text {
            text-align: center;
            width: 100%;
            height: 60px;
            position: relative;
            margin-bottom: 20px;
        }
        
        .loading-phrase {
            font-size: 20px;
            color: var(--text-primary);
            font-weight: 300;
            font-family: 'Georgia', serif;
            line-height: 1.4;
            text-align: center;
            opacity: 0;
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        
        .loading-progress {
            width: calc(100% - 50px);
            height: 2px;
            background: var(--veins-gold);
            border-radius: 1px;
            overflow: hidden;
            position: absolute;
            bottom: 50px;
            left: 25px;
            right: 25px;
        }
        
        .light-theme .loading-progress {
            background: var(--veins-chocolate);
        }
        
        .loading-progress-fill {
            position: absolute;
            height: 100%;
            width: 0%;
            background: var(--line-color);
            border-radius: 1px;
            transition: width 0.5s ease;
        }
        
        .progress-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            padding: 0 25px;
        }
        
        .progress-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--veins-gold);
            transition: all 0.3s ease;
        }
        
        .light-theme .progress-dot {
            background: var(--veins-chocolate);
        }
        
        .progress-dot.active {
            background: var(--gold);
            transform: scale(1.2);
        }
        
        .light-theme .progress-dot.active {
            background: var(--chocolate);
        }
        
        /* ===== АНИМАЦИИ ===== */
        @keyframes petalOpen {
            0% {
                opacity: 0;
                transform: rotate(var(--rotate-start)) translateY(20px) scale(0.3);
            }
            70% {
                opacity: 1;
                transform: rotate(var(--rotate-end)) translateY(0) scale(1.1);
            }
            100% {
                opacity: 1;
                transform: rotate(var(--rotate-end)) translateY(0) scale(1);
            }
        }
        
        @keyframes centerOpen {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.2);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        
        @keyframes centerPulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 
                    inset 0 0 5px var(--light-gold),
                    0 0 8px var(--gold);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                box-shadow: 
                    inset 0 0 8px var(--light-gold),
                    0 0 12px var(--gold);
            }
        }
        
        @keyframes phraseFadeIn {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes phraseFadeOut {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-10px);
            }
        }
        
        /* Стили для статуса подбора */
        .matching-status {
            text-align: center;
            margin-top: 20px;
            min-height: 60px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .status-item {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 2px 0;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
            text-align: center;
            padding: 2px 10px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            max-width: 90%;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Цветок будет открываться/закрываться */
        .peony.closing .peony-petal {
            animation: petalClose 1s ease forwards !important;
        }
        
        .peony.closing .peony-center {
            animation: centerClose 1s ease forwards !important;
        }
        
        .peony.opening .peony-petal {
            animation: petalOpen 1.2s ease forwards !important;
        }
        
        .peony.opening .peony-center {
            animation: centerOpen 1.5s ease forwards !important;
        }
    </style>
</head>

    function togglePeony(state) {

        if (state === 'close') {
            peony.classList.remove('opening');
            peony.classList.add('closing');
        } else {
            peony.classList.remove('closing');
            peony.classList.add('opening');
        }

    function startPhrasesAnimation() {
        let currentIndex = 0;
        
        function showNextPhrase() {
            const phrases = document.querySelectorAll('.loading-phrase');
            if (phrases.length === 0) return;
            
            // Скрываем текущую фразу
            phrases[currentIndex].style.opacity = '0';
            phrases[currentIndex].style.animation = 'phraseFadeOut 0.5s ease forwards';
            
            // Обновляем индекс
            currentIndex = (currentIndex + 1) % phrases.length;
            
            // Показываем следующую фразу
            setTimeout(() => {
                phrases[currentIndex].style.opacity = '1';
                phrases[currentIndex].style.animation = 'phraseFadeIn 0.5s ease forwards';
                
                // Обновляем активную точку прогресса
                updateProgressDots(currentIndex);
                
                // Обновляем статус подбора
                updateMatchingStatus(currentIndex);
                
                // Анимируем цветок (открываем/закрываем)
                if (currentIndex % 2 === 0) {
                    setTimeout(() => togglePeony('close'), 500);
                    setTimeout(() => togglePeony('open'), 1500);
                }
            }, 500);
            
            // Устанавливаем следующий таймер
            const nextDelay = currentIndex === 0 ? 3000 : 2500;
            setTimeout(showNextPhrase, nextDelay);
        }
        
        // Запускаем первую фразу сразу
        setTimeout(showNextPhrase, 3000);
    }

    function updateProgressDots(index) {
        const dots = document.querySelectorAll('.progress-dot');
        dots.forEach((dot, i) => {

            "Определяем ваши предпочтения...",

        ];
        
        // Очищаем контейнер

            const statusItem = document.createElement('div');

            statusContainer.appendChild(statusItem);

    // 1. ПОЛУЧЕНИЕ ДАННЫХ ТЕСТА
    function getQuizData() {
        // Пробуем все возможные источники данных
        const sources = [
            'quizAnswers',
            'quizTransferData', 
            'quizBranchData',
            'scentme_quiz_results',
            'quizData'
        ];
        
        for (const source of sources) {
            const data = localStorage.getItem(source);
            if (data) {
                try {
                    const parsed = JSON.parse(data);
                    console.log(`✅ Данные найдены в ${source}:`, parsed);
                    return parsed;
                } catch (e) {
                    console.warn(`⚠️ Не удалось распарсить ${source}`);
                }
            }
        }
        
        return null;
    }

    // 2. ОПРЕДЕЛЕНИЕ ТИПА ТЕСТА
    function determineQuizType(quizData) {
        // Проверяем различные признаки масел
        const oilIndicators = [
            quizData.quizType === 'oils',
            quizData.answers?.q2 === 'oils',
            quizData.answers?.branch?.oils_quick_purpose,
            quizData.answers?.branch && Object.keys(quizData.answers.branch).some(k => k.includes('oils')),
            quizData.purpose && Array.isArray(quizData.purpose) // Если есть массив purpose
        ];
        
        return oilIndicators.some(indicator => indicator) ? 'oils' : 'perfume';
    }

    // 3. АНАЛИЗ ПРЕДПОЧТЕНИЙ ПОЛЬЗОВАТЕЛЯ
    function analyzeUserPreferences(quizData, quizType) {
        const preferences = {
            gender: null,
            season: [],
            occasions: [],
            scentTypes: [],
            purpose: [],
            mood: null,
            budget: null,
            intensity: null,
            age: null,
            style: null,
            notes: []
        };
        
        // Получаем ответы из разных структур
        const answers = quizData.answers || quizData;
        const branchAnswers = quizData.answers?.branch || {};
        
        // ОСНОВНЫЕ ВОПРОСЫ
        if (answers.q1) preferences.gender = mapGender(answers.q1);
        if (answers.q2) preferences.budget = mapBudget(answers.q2);
        
        // ТИПЫ АРОМАТОВ
        if (answers.q3 && Array.isArray(answers.q3)) {
            preferences.scentTypes = answers.q3.map(mapScentType);
        }
        
        // СЕЗОНЫ
        if (answers.q4 && Array.isArray(answers.q4)) {
            preferences.season = answers.q4.map(mapSeason);
        }
        
        // ПОВОДЫ
        if (answers.q5 && Array.isArray(answers.q5)) {
            preferences.occasions = answers.q5.map(mapOccasion);
        }
        
        // ВОПРОСЫ ВЕТКИ ПАРФЮМОВ
        if (branchAnswers.perfume_quick_gender) {
            preferences.gender = mapGender(branchAnswers.perfume_quick_gender);
        }
        if (branchAnswers.perfume_quick_season) {
            preferences.season = [mapSeason(branchAnswers.perfume_quick_season)];
        }
        if (branchAnswers.perfume_quick_mood) {
            preferences.mood = mapMood(branchAnswers.perfume_quick_mood);
        }
        if (branchAnswers.perfume_quick_price) {
            preferences.budget = mapBudget(branchAnswers.perfume_quick_price);
        }
        
        // ВОПРОСЫ ВЕТКИ МАСЕЛ
        if (branchAnswers.oils_quick_purpose) {
            preferences.purpose = [mapPurpose(branchAnswers.oils_quick_purpose)];
        }
        if (branchAnswers.oils_quick_mood) {
            preferences.mood = mapMood(branchAnswers.oils_quick_mood);
        }
        
        // ДОПОЛНИТЕЛЬНЫЕ ВОПРОСЫ
        if (answers.age) preferences.age = answers.age;
        if (answers.style) preferences.style = answers.style;
        if (answers.intensity) preferences.intensity = answers.intensity;
        
        return preferences;
    }

    // 4. ПОИСК СОВПАДЕНИЙ
    function findMatches(database, preferences, quizType) {
        const matches = [];
        
        database.forEach(item => {
            let score = 0;
            const reasons = [];
            
            // БАЗОВЫЕ ПРОВЕРКИ ДЛЯ ВСЕХ ТИПОВ
            // Пол (20 баллов)
            if (preferences.gender && item.gender) {
                const itemGender = item.gender.toLowerCase();
                const prefGender = preferences.gender.toLowerCase();
                
                if (itemGender.includes(prefGender) || 
                    itemGender.includes('унисекс') || 
                    prefGender.includes('унисекс')) {
                    score += 20;
                    reasons.push(`Подходит по полу (${preferences.gender})`);
                }
            }
            
            // Бюджет (15 баллов)
            if (preferences.budget && item.priceRange) {
                const budgetPriority = {
                    'budget': ['budget'],
                    'mid': ['budget', 'mid'],
                    'premium': ['mid', 'premium'],
                    'luxury': ['premium', 'luxury']
                };
                
                if (budgetPriority[preferences.budget]?.includes(item.priceRange)) {
                    score += 15;
                    reasons.push('Соответствует вашему бюджету');
                }
            }
            
            // ПАРФЮМЫ
            if (quizType === 'perfume') {
                // Сезон (20 баллов)
                if (preferences.season && preferences.season.length > 0 && item.season) {
                    const matchingSeasons = preferences.season.filter(season =>
                        item.season.some(s => s.toLowerCase().includes(season.toLowerCase()))
                    );
                    if (matchingSeasons.length > 0) {
                        score += 20;
                        reasons.push(`Идеален для ${matchingSeasons.join(', ')}`);
                    }
                }
                
                // Тип аромата (25 баллов)
                if (preferences.scentTypes && preferences.scentTypes.length > 0) {
                    const itemType = item.type?.toLowerCase() || '';
                    const itemTags = item.tags?.map(t => t.toLowerCase()) || [];
                    
                    const matchingScents = preferences.scentTypes.filter(scent => {
                        const scentLower = scent.toLowerCase();
                        return itemType.includes(scentLower) || 
                               itemTags.some(tag => tag.includes(scentLower));
                    });
                    
                    if (matchingScents.length > 0) {
                        score += 25;
                        reasons.push(`Ваш тип аромата: ${matchingScents.join(', ')}`);
                    }
                }
                
                // Поводы (15 баллов)
                if (preferences.occasions && preferences.occasions.length > 0 && item.occasions) {
                    const matchingOccasions = preferences.occasions.filter(occasion =>
                        item.occasions.some(occ => 
                            occ.toLowerCase().includes(occasion.toLowerCase()) ||
                            occasion.toLowerCase().includes(occ.toLowerCase())
                        )
                    );
                    if (matchingOccasions.length > 0) {
                        score += 15;
                        reasons.push(`Подходит для: ${matchingOccasions.join(', ')}`);
                    }
                }
                
                // Настроение (10 баллов)
                if (preferences.mood && item.tags) {
                    const moodTags = {
                        'расслабленный': ['успокаивающий', 'нежный', 'мягкий'],
                        'энергичный': ['бодрящий', 'энергичный', 'яркий'],
                        'романтичный': ['романтичный', 'нежный', 'чувственный'],
                        'уверенный': ['уверенный', 'сильный', 'харизматичный'],
                        'загадочный': ['загадочный', 'глубокий', 'интригующий']
                    };
                    
                    if (moodTags[preferences.mood]) {
                        const hasMatchingTag = moodTags[preferences.mood].some(tag =>
                            item.tags.some(itemTag => itemTag.includes(tag))
                        );
                        if (hasMatchingTag) {
                            score += 10;
                            reasons.push(`Создаёт настроение: ${preferences.mood}`);
                        }
                    }
                }
            }
            
            // МАСЛА
            else if (quizType === 'oils') {
                // Назначение (30 баллов)
                if (preferences.purpose && preferences.purpose.length > 0 && item.purpose) {
                    const matchingPurposes = preferences.purpose.filter(purpose =>
                        item.purpose.some(p => 
                            p.toLowerCase().includes(purpose.toLowerCase()) ||
                            purpose.toLowerCase().includes(p.toLowerCase())
                        )
                    );
                    if (matchingPurposes.length > 0) {
                        score += 30;
                        reasons.push(`Для: ${matchingPurposes.join(', ')}`);
                    }
                }
                
                // Эффект (20 баллов)
                if (preferences.mood && item.effect) {
                    const moodEffects = {
                        'расслабленный': ['успокаивающий', 'расслабляющий', 'снотворный'],
                        'энергичный': ['бодрящий', 'стимулирующий', 'освежающий'],
                        'романтичный': ['афродизиак', 'расслабляющий', 'чувственный'],
                        'уверенный': ['тонизирующий', 'стимулирующий']
                    };
                    
                    if (moodEffects[preferences.mood]) {
                        const hasEffect = moodEffects[preferences.mood].some(effect =>
                            item.effect.some(e => e.toLowerCase().includes(effect))
                        );
                        if (hasEffect) {
                            score += 20;
                            reasons.push(`Эффект: ${preferences.mood}`);
                        }
                    }
                }
                
                // Семейство ароматов (15 баллов)
                if (preferences.scentTypes && preferences.scentTypes.length > 0 && item.scentFamily) {
                    const itemFamily = item.scentFamily.toLowerCase();
                    const hasMatchingScent = preferences.scentTypes.some(scent =>
                        itemFamily.includes(scent.toLowerCase())
                    );
                    if (hasMatchingScent) {
                        score += 15;
                        reasons.push(`Ароматическое семейство: ${preferences.scentTypes.join(', ')}`);
                    }
                }
            }
            
            // ДОПОЛНИТЕЛЬНЫЕ БАЛЛЫ
            // Популярность (5-10 баллов)
            if (item.tags && item.tags.some(tag => ['популярный', 'хит', 'классика', 'бестселлер'].includes(tag))) {
                score += 5 + Math.floor(Math.random() * 6);
                reasons.push('Популярный выбор');
            }
            
            // Универсальность (5 баллов)
            if (item.tags && item.tags.some(tag => ['универсальный', 'круглогодичный', 'повседневный'].includes(tag))) {
                score += 5;
                reasons.push('Универсальный аромат');
            }
            
            // ГАРАНТИРОВАННЫЕ БАЛЛЫ ДЛЯ ВСЕХ
            score += 10 + Math.floor(Math.random() * 11); // 10-20 баллов гарантировано
            
            // ПРОВЕРКА МИНИМАЛЬНОГО ПОРОГА
            if (score >= 40) { // Минимум 40 баллов для рекомендации
                const matchPercentage = Math.min(95, score + Math.floor(Math.random() * 11)); // 0-10 рандомных баллов
                
                matches.push({
                    ...item,
                    matchScore: score,
                    matchPercentage: matchPercentage,
                    matchReasons: reasons.slice(0, 3), // Максимум 3 причины
                    collection: false
                });
            }
        });
        
        // СОРТИРОВКА И ОГРАНИЧЕНИЕ
        matches.sort((a, b) => b.matchPercentage - a.matchPercentage);
        
        // Если совпадений меньше 4, добавляем лучшие из базы
        if (matches.length < 4) {
            const topItems = database
                .filter(item => !matches.some(m => m.id === item.id))
                .slice(0, 8 - matches.length)
                .map(item => ({
                    ...item,
                    matchScore: 60 + Math.floor(Math.random() * 31), // 60-90
                    matchPercentage: 60 + Math.floor(Math.random() * 31),
                    matchReasons: ['Персональная рекомендация на основе вашего профиля'],
                    collection: false
                }));
            
            matches.push(...topItems);
            matches.sort((a, b) => b.matchPercentage - a.matchPercentage);
        }
        
        // Динамическое количество результатов:
const highMatches = matches.filter(m => m.matchPercentage >= 75);
const mediumMatches = matches.filter(m => m.matchPercentage >= 60 && m.matchPercentage < 75);

if (highMatches.length >= 4) {
    return highMatches.slice(0, 6); // 4-6 отличных результатов
} else if (highMatches.length + mediumMatches.length >= 6) {
    const allMatches = [...highMatches, ...mediumMatches];
    return allMatches.slice(0, 8); // до 8 хороших результатов
} else {
    return matches.slice(0, 6); // минимум 6 результатов
}
    }

    // 5. СОХРАНЕНИЕ РЕЗУЛЬТАТОВ
    function saveDetailedResults(matches, quizData, preferences, quizType) {
        try {
            const results = {
                timestamp: new Date().toISOString(),
                quizType: quizType,
                matches: matches,
                totalFound: matches.length,
                userData: quizData,
                userPreferences: preferences,
                algorithmVersion: '3.0_real',
                stats: {
                    avgMatchPercentage: Math.round(matches.reduce((sum, m) => sum + m.matchPercentage, 0) / matches.length),
                    topMatch: matches[0]?.matchPercentage || 0,
                    minMatch: matches[matches.length - 1]?.matchPercentage || 0,
                    matchedPreferences: Object.keys(preferences).filter(k => preferences[k]).length
                }
            };
            
            localStorage.setItem('scentme_matching_results', JSON.stringify(results));
            console.log('💾 Результаты сохранены:', results);
            
        } catch (error) {
            console.error('❌ Ошибка сохранения:', error);
        }
    }

    // РЕЗЕРВНЫЙ ВАРИАНТ
    function createDemoResults() {
        const quizType = localStorage.getItem('quizType') || 'perfume';
        const database = quizType === 'oils' ? oilsDatabase : perfumesDatabase;
        
        return database.slice(0, 8).map(item => ({
            ...item,
            matchScore: 70 + Math.floor(Math.random() * 21),
            matchPercentage: 70 + Math.floor(Math.random() * 21),
            matchReasons: ['Индивидуальная рекомендация на основе ваших ответов'],
            collection: false
        }));
    }

    function saveMatchingResults(matches) {
        console.log(`💾 Сохранено ${matches.length} персонализированных рекомендаций`);
    }

    // ===== НАВИГАЦИЯ К РЕЗУЛЬТАТАМ =====
    function navigateToResults() {
        console.log('🚀 Переход к результатам...');
        
        // Сохраняем флаг, что мы переходим с экрана загрузки
        localStorage.setItem('fromLoadingScreen', 'true');
        
        // Сохраняем тип теста для использования на странице результатов
        const userData = getQuizData();
        if (userData) {
            const quizType = determineQuizType(userData);
            localStorage.setItem('quizType', quizType);
        }
        
        // Переход на страницу результатов
        setTimeout(() => {
            window.location.href = 'results.html';
        }, 1000);
    }
</script>
