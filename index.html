<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scentmé - ваш парфюмерный гид</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="user-manager.js"></script>
    <style>
        /* ===== ОСНОВНЫЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            position: relative;
            overflow: hidden;
        }
        
        /* ===== ТЁМНАЯ ТЕМА ===== */
        :root {
            /* Цвета */
            --dark-chocolate: #3D1F12;
            --walnut-brown: #584738;
            --sand-beige: #98755B;
            --cream-ivory: #F1EADA;
            --pure-white: #FFFFFF;
            --gold: #D4AF37;
            --light-gold: #F4E4A6;
            --dark-beige: #D8C9B0;
            --warm-gray: #A99E8B;
            
            /* Переменные */
            --bg-primary: #2A1A0F;
            --bg-card: rgba(30, 23, 18, 0.85);
            --text-primary: var(--light-gold);
            --text-secondary: rgba(244, 228, 166, 0.9);
            --border-color: rgba(212, 175, 55, 0.25);
            --button-bg: linear-gradient(135deg, 
                rgba(61, 31, 18, 0.9) 0%, 
                rgba(88, 71, 56, 0.9) 100%);
            --button-text: var(--light-gold);
            --accent-color: var(--pure-white);
            --title-color: var(--light-gold);
            --line-color: linear-gradient(90deg, 
                transparent, 
                var(--gold), 
                var(--light-gold), 
                var(--gold), 
                transparent);
            --veins-gold: rgba(212, 175, 55, 0.08);
            --veins-light-gold: rgba(244, 228, 166, 0.15);
            --icon-color: var(--light-gold);
        }
        
        /* ===== СВЕТЛАЯ ТЕМА ===== */
        .light-theme {
            /* Цвета */
            --chocolate: #684627;
            --roasted-peach: #E8A895;
            --whole-wheat: #EFD2B0;
            --milky-coffee: #B59272;
            --cream: #FFE4B8;
            --peony-pink: #E8A8B8;
            --peony-dark-pink: #C97A8D;
            
            /* Переменные */
            --bg-primary: #FFF8ED;
            --bg-card: rgba(255, 252, 245, 0.95);
            --text-primary: #5C4A36;
            --text-secondary: #7D6B57;
            --border-color: #684627;
            --button-bg: linear-gradient(135deg, 
                var(--roasted-peach) 0%,     
                var(--whole-wheat) 100%);
            --button-text: #684627;
            --accent-color: #7D6B57;
            --title-color: #684627;
            --line-color: linear-gradient(90deg, 
                var(--milky-coffee), 
                var(--chocolate), 
                var(--milky-coffee));
            --veins-chocolate: rgba(104, 70, 39, 0.15);
            --veins-coffee: rgba(181, 146, 114, 0.12);
            --icon-color: #5C4A36;
        }
        
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        /* ===== ФОНЫ С ПРОЖИЛКАМИ ===== */
        .theme-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            transition: none !important;
        }
        
        .theme-bg:not(.active) {
            display: none;
        }
        
        .theme-bg.dark {
            background: #2A1A0F;
        }
        
        .theme-bg.dark::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(65deg, 
                    transparent 28%,
                    var(--veins-gold) 29%,
                    var(--veins-light-gold) 32%,
                    var(--veins-gold) 35%,
                    transparent 36%),
                linear-gradient(-75deg, 
                    transparent 62%,
                    var(--veins-gold) 63%,
                    var(--veins-light-gold) 65%,
                    var(--veins-gold) 67%,
                    transparent 68%),
                linear-gradient(40deg, 
                    transparent 15%,
                    var(--veins-light-gold) 16%,
                    transparent 17%,
                    transparent 45%,
                    var(--veins-gold) 46%,
                    transparent 47%),
                linear-gradient(85deg, 
                    transparent 5%,
                    var(--veins-gold) 6%,
                    transparent 7%,
                    transparent 25%,
                    var(--veins-light-gold) 26%,
                    transparent 27%),
                linear-gradient(110deg, 
                    transparent 40%,
                    var(--veins-light-gold) 41%,
                    transparent 42%);
            mix-blend-mode: screen;
            opacity: 0.6;
        }
        
        .theme-bg.dark::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(115deg, 
                    transparent 28%,
                    var(--veins-gold) 29%,
                    var(--veins-light-gold) 32%,
                    var(--veins-gold) 35%,
                    transparent 36%),
                linear-gradient(-45deg, 
                    transparent 62%,
                    var(--veins-gold) 63%,
                    var(--veins-light-gold) 65%,
                    var(--veins-gold) 67%,
                    transparent 68%),
                linear-gradient(140deg, 
                    transparent 15%,
                    var(--veins-light-gold) 16%,
                    transparent 17%,
                    transparent 45%,
                    var(--veins-gold) 46%,
                    transparent 47%),
                linear-gradient(95deg, 
                    transparent 75%,
                    var(--veins-gold) 76%,
                    transparent 77%,
                    transparent 85%,
                    var(--veins-light-gold) 86%,
                    transparent 87%),
                linear-gradient(70deg, 
                    transparent 60%,
                    var(--veins-light-gold) 61%,
                    transparent 62%);
            mix-blend-mode: screen;
            opacity: 0.6;
        }
        
        .theme-bg.light {
            background: #FFF8ED;
        }
        
        .theme-bg.light::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(65deg, 
                    transparent 28%,
                    var(--veins-chocolate) 29%,
                    rgba(104, 70, 39, 0.25) 32%,
                    var(--veins-chocolate) 35%,
                    transparent 36%),
                linear-gradient(-75deg, 
                    transparent 62%,
                    var(--veins-chocolate) 63%,
                    rgba(104, 70, 39, 0.22) 65%,
                    var(--veins-chocolate) 67%,
                    transparent 68%),
                linear-gradient(40deg, 
                    transparent 15%,
                    var(--veins-coffee) 16%,
                    transparent 17%,
                    transparent 45%,
                    rgba(181, 146, 114, 0.14) 46%,
                    transparent 47%),
                linear-gradient(85deg, 
                    transparent 5%,
                    var(--veins-chocolate) 6%,
                    transparent 7%,
                    transparent 25%,
                    var(--veins-coffee) 26%,
                    transparent 27%),
                linear-gradient(110deg, 
                    transparent 40%,
                    var(--veins-coffee) 41%,
                    transparent 42%);
            mix-blend-mode: multiply;
            opacity: 0.8;
            filter: blur(0.4px);
        }
        
        .theme-bg.light::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(115deg, 
                    transparent 28%,
                    var(--veins-chocolate) 29%,
                    rgba(104, 70, 39, 0.25) 32%,
                    var(--veins-chocolate) 35%,
                    transparent 36%),
                linear-gradient(-45deg, 
                    transparent 62%,
                    var(--veins-chocolate) 63%,
                    rgba(104, 70, 39, 0.22) 65%,
                    var(--veins-chocolate) 67%,
                    transparent 68%),
                linear-gradient(140deg, 
                    transparent 15%,
                    var(--veins-coffee) 16%,
                    transparent 17%,
                    transparent 45%,
                    rgba(181, 146, 114, 0.14) 46%,
                    transparent 47%),
                linear-gradient(95deg, 
                    transparent 75%,
                    var(--veins-chocolate) 76%,
                    transparent 77%,
                    transparent 85%,
                    var(--veins-coffee) 86%,
                    transparent 87%),
                linear-gradient(70deg, 
                    transparent 60%,
                    var(--veins-coffee) 61%,
                    transparent 62%);
            mix-blend-mode: multiply;
            opacity: 0.8;
            filter: blur(0.4px);
        }
        
        /* ===== ПЕРЕКЛЮЧАТЕЛЬ ТЕМЫ ===== */
        .theme-toggle {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .theme-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
            transition: opacity 0.2s ease;
        }
        
        .theme-icon:hover {
            opacity: 1;
        }
        
        .theme-icon svg {
            width: 100%;
            height: 100%;
            stroke: var(--icon-color);
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.1);
            transition: none;
            border-radius: 34px;
            border: 1px solid var(--border-color);
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 3px;
            background-color: var(--button-text);
            transition: none;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        input:checked + .toggle-slider {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(30px);
        }
        
        /* ===== ОСНОВНОЙ КОНТЕЙНЕР ===== */
        .app-container {
            width: 100%;
            max-width: 400px;
            height: 90vh;
            max-height: 700px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }
        
        .screen.active {
            display: flex;
        }
        
        /* ===== ЭКРАН 1: СТАРТОВЫЙ ===== */
        #screen-welcome {
            padding-top: 80px;
        }
        
        .welcome-card {
            background: var(--bg-card);
            border-radius: 28px;
            padding: 50px 35px 40px;
            text-align: center;
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.15),
                0 0 0 2px var(--border-color);
            border: 2px solid var(--border-color);
            backdrop-filter: blur(15px) saturate(180%);
            position: relative;
            overflow: hidden;
            width: 100%;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .welcome-card::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border-radius: 24px;
            border: 1px solid transparent;
            background: linear-gradient(135deg, 
                var(--veins-gold), 
                var(--veins-light-gold),
                var(--veins-gold)) border-box;
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            pointer-events: none;
            z-index: 1;
        }
        
        .light-theme .welcome-card::before {
            background: linear-gradient(135deg, 
                var(--veins-chocolate), 
                var(--veins-coffee),
                var(--veins-chocolate)) border-box;
        }
        
        .main-title {
            color: var(--title-color);
            font-size: 36px;
            font-weight: 300;
            margin-bottom: 15px;
            letter-spacing: 3px;
            position: relative;
            text-transform: uppercase;
            font-family: 'Georgia', serif;
            z-index: 2;
        }
        
        .tagline {
            color: var(--text-secondary);
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 70px;
            font-weight: 300;
            padding: 0 15px;
            position: relative;
            letter-spacing: 0.5px;
            font-family: 'Georgia', serif;
            z-index: 2;
        }
        
        .tagline::before,
        .tagline::after {
            content: '✦';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--border-color);
            opacity: 0.4;
            font-size: 12px;
        }
        
        .tagline::before {
            left: 0;
        }
        
        .tagline::after {
            right: 0;
        }
        
        /* ===== КНОПКИ ===== */
        .buttons-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px; /* Увеличиваем расстояние между кнопками */
            margin-top: 10px;
        }
        
        .primary-btn {
            background: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 20px 45px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.15),
                0 0 0 1px var(--border-color);
            font-family: 'Georgia', serif;
            z-index: 2;
        }
        
        .primary-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                transparent,
                rgba(255, 255, 255, 0.1),
                rgba(255, 255, 255, 0.2),
                rgba(255, 255, 255, 0.1),
                transparent);
            transition: left 0.6s ease;
        }
        
        .primary-btn:hover::before {
            left: 100%;
        }
        
        .primary-btn:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 15px 40px rgba(0, 0, 0, 0.2),
                0 0 0 2px var(--border-color),
                0 0 25px rgba(255, 228, 184, 0.1);
        }
        
        .secondary-btn {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 18px 45px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            font-family: 'Georgia', serif;
            z-index: 2;
        }
        
        .secondary-btn:hover {
            background: var(--button-bg);
            color: var(--button-text);
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="dark-theme">
    <!-- Фоны -->
    <div class="theme-bg dark active"></div>
    <div class="theme-bg light"></div>
    
    <!-- Переключатель темы -->
    <div class="theme-toggle">
        <div class="theme-icon" title="Тёмная тема">
            <svg viewBox="0 0 24 24">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </div>
        <label class="toggle-switch">
            <input type="checkbox" id="themeToggle">
            <span class="toggle-slider"></span>
        </label>
        <div class="theme-icon" title="Светлая тема">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
        </div>
    </div>
    
    <!-- Основной контейнер -->
    <div class="app-container">
        <!-- ЭКРАН 1: СТАРТОВЫЙ -->
        <div class="screen active" id="screen-welcome">
            <div class="welcome-card">
                <h1 class="main-title">Scentmé</h1>
                <p class="tagline">Найди аромат, который пахнет тобой</p>
                
                <div class="buttons-container">
                    <button class="secondary-btn" onclick="startGuestMode()">
                        ВОЙТИ БЕЗ СОХРАНЕНИЯ
                    </button>
                    
                    <button class="primary-btn" onclick="goToLogin()">
                        ВОЙТИ В ПРОФИЛЬ
                    </button>
                </div>
            </div>
        </div>
    </div>

   <script>
    // ===== ОСНОВНЫЕ ПЕРЕМЕННЫЕ =====
    
    // Инициализация Telegram Web App
    let tg = window.Telegram?.WebApp;
    
    // Определение текущей темы
    const currentTheme = localStorage.getItem('theme') || 'dark';
    const themeToggle = document.getElementById('themeToggle');
    
    // Установка начальной темы
    if (currentTheme === 'light') {
        document.body.classList.add('light-theme');
        document.querySelector('.theme-bg.dark').classList.remove('active');
        document.querySelector('.theme-bg.light').classList.add('active');
        themeToggle.checked = true;
        
        if (tg) {
            tg.setHeaderColor('#FFF8ED');
            tg.setBackgroundColor('#FFF8ED');
        }
    } else {
        if (tg) {
            tg.setHeaderColor('#3D1F12');
            tg.setBackgroundColor('#2A1A0F');
        }
    }
    
    if (tg) {
        tg.expand();
    }
    
    // Смена темы
    themeToggle.addEventListener('change', function() {
        if (this.checked) {
            document.body.classList.add('light-theme');
            document.querySelector('.theme-bg.dark').classList.remove('active');
            document.querySelector('.theme-bg.light').classList.add('active');
            localStorage.setItem('theme', 'light');
            
            if (tg) {
                requestAnimationFrame(() => {
                    tg.setHeaderColor('#FFF8ED');
                    tg.setBackgroundColor('#FFF8ED');
                });
            }
        } else {
            document.body.classList.remove('light-theme');
            document.querySelector('.theme-bg.light').classList.remove('active');
            document.querySelector('.theme-bg.dark').classList.add('active');
            localStorage.setItem('theme', 'dark');
            
            if (tg) {
                requestAnimationFrame(() => {
                    tg.setHeaderColor('#3D1F12');
                    tg.setBackgroundColor('#2A1A0F');
                });
            }
        }
    });
    
    // ===== ОСНОВНЫЕ ФУНКЦИИ =====
    
    /**
     * Режим гостя
     */
    function startGuestMode() {
        // Устанавливаем гостевой режим (не запоминаем в localStorage)
        userManager.setMode('guest', false);
        
        // Очищаем историю теста для гостя
        localStorage.removeItem('quiz_completed');
        localStorage.removeItem('isNewUser');
        localStorage.removeItem('quiz_skip_data');
        
        console.log('Режим гостя активирован');
        
        // Переходим на страницу start.html
        window.location.href = 'start.html';
    }
    
    /**
     * Вход в профиль
     */
    function goToLogin() {
        // Просто переходим на страницу логина
        window.location.href = 'login.html';
    }
    
    // ===== ПРОВЕРКА ПРИ ЗАГРУЗКЕ =====
    document.addEventListener('DOMContentLoaded', function() {
        // Проверяем, если пользователь уже зарегистрирован И прошёл тест
        if (userManager.isRegistered() && userManager.isQuizCompleted()) {
            // Сразу на главную
            window.location.href = 'main.html';
        }
        
        // Проверяем HTTPS для GitHub Pages
        if (location.protocol === 'http:' && location.hostname.includes('github.io')) {
            location.href = location.href.replace('http:', 'https:');
        }
        
        // Логирование текущего режима для отладки
        console.log('Текущий режим:', userManager.getMode());
        console.log('Тест пройден?', userManager.isQuizCompleted());
    });
</script>
</body>
</html>
