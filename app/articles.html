<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статьи - Scentmé</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        /* === СБРОС СТИЛЕЙ === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* === ПЕРЕМЕННЫЕ ЦВЕТОВЫХ ТЕМ === */
        :root {
            /* ===== СВЕТЛАЯ ТЕМА ===== */
            --chocolate: #684627;
            --roasted-peach: #E8A895;
            --whole-wheat: #EFD2B0;
            --milky-coffee: #B59272;
            --cream: #FFE4B8;
            --peony-pink: #E8A8B8;
            --light-beige: #FFF8ED;
            --border-light: rgba(104, 70, 39, 0.3);
            --shadow-light: rgba(104, 70, 39, 0.1);
            --shadow-medium: rgba(104, 70, 39, 0.2);
            
            /* Для интерфейса (светлая) */
            --background: #FFF8ED;
            --card-bg: white;
            --text-primary: #5C4A36;
            --text-secondary: #7D6B57;
            --new-badge: #E8A895;      /* roasted-peach */
            --read-badge: #B59272;     /* milky-coffee */
            --collection-badge: #E8A895; /* roasted-peach для флажка коллекции */
            --menu-active: #E8A895;    /* цвет активного пункта меню */
            --modal-bg: white;         /* фон модального окна */
            --header-bg: white;        /* цвет шапки */
        }
        
        /* ===== ТЁМНАЯ ТЕМА ===== */
        .dark-theme {
            /* Цвета из тёмной темы */
            --dark-chocolate: #3D1F12;
            --walnut-brown: #584738;
            --sand-beige: #98755B;
            --cream-ivory: #F1EADA;
            --pure-white: #FFFFFF;
            --gold: #D4AF37;
            --light-gold: #F4E4A6;
            --dark-beige: #D8C9B0;
            --warm-gray: #A99E8B;
            
            /* Для интерфейса (тёмная) - ИЗМЕНЕНИЯ ЗДЕСЬ */
            --background: #3D1F12;     /* dark-chocolate */
            --card-bg: #584738;        /* walnut-brown */
            --text-primary: #F1EADA;   /* cream-ivory */
            --text-secondary: #D8C9B0; /* dark-beige */
            --new-badge: #D4AF37;      /* gold - вместо roasted-peach */
            --read-badge: #A99E8B;     /* warm-gray - вместо milky-coffee */
            --collection-badge: #D4AF37; /* gold для флажка коллекции */
            --menu-active: #D4AF37;    /* gold для активного пункта меню */
            --border-light: rgba(241, 234, 218, 0.2); /* cream-ivory 20% */
            --shadow-light: rgba(0, 0, 0, 0.4);
            --shadow-medium: rgba(0, 0, 0, 0.6);
            --modal-bg: #221810;       /* на пару тонов светлее шапки */
            --header-bg: #221810;      /* ТЁМНЫЙ цвет шапки как указано */
        }
        
        /* === ОСНОВНЫЕ СТИЛИ === */
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--background);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            transition: all 0.3s ease;
        }
        
        /* === ШАПКА (как в main.html) === */
        .app-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        
        .main-header {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-light);
            background: var(--header-bg);      /* Используем отдельную переменную для шапки */
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 15px var(--shadow-light);
        }
        
        .menu-toggle {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--chocolate);
            cursor: pointer;
            padding: 5px;
            opacity: 0.8;
            transition: all 0.3s ease;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }
        
        .dark-theme .menu-toggle {
            color: var(--cream-ivory);
        }
        
        .menu-toggle:hover {
            opacity: 1;
            background: rgba(104, 70, 39, 0.1);
        }
        
        .dark-theme .menu-toggle:hover {
            background: rgba(241, 234, 218, 0.1);
        }
        
        .main-title {
            font-size: 20px;
            color: var(--chocolate);
            font-weight: 300;
            font-family: 'Georgia', serif;
            letter-spacing: 1px;
        }
        
        .dark-theme .main-title {
            color: var(--cream-ivory);
        }
        
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            opacity: 0.8;
            transition: opacity 0.3s ease;
            position: relative;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .profile-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--roasted-peach), var(--whole-wheat));
            color: var(--chocolate);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            border: 1px solid var(--border-light);
            box-shadow: 0 2px 8px var(--shadow-light);
            transition: all 0.3s ease;
        }
        
        .dark-theme .profile-avatar {
            background: linear-gradient(135deg, var(--gold), var(--sand-beige));
            color: var(--dark-chocolate);
        }
        
        .profile-btn:hover .profile-avatar {
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--shadow-medium);
        }
        
        /* === ОСНОВНОЙ КОНТЕНТ === */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
            background: var(--background);
        }
        
        /* Кастомный скроллбар */
        .content-area::-webkit-scrollbar {
            width: 8px;
        }
        
        .content-area::-webkit-scrollbar-track {
            background: rgba(232, 168, 149, 0.1);
            border-radius: 4px;
            margin: 5px;
        }
        
        .dark-theme .content-area::-webkit-scrollbar-track {
            background: rgba(212, 175, 55, 0.1);
        }
        
        .content-area::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--roasted-peach), var(--milky-coffee));
            border-radius: 4px;
            border: 2px solid var(--light-beige);
        }
        
        .dark-theme .content-area::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--gold), var(--warm-gray));
            border: 2px solid var(--dark-chocolate);
        }
        
        .content-area::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, var(--milky-coffee), var(--roasted-peach));
        }
        
        .dark-theme .content-area::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, var(--warm-gray), var(--gold));
        }
        
        /* === СТИЛИ ДЛЯ СТАТЕЙ === */
        .articles-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .article-item {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px var(--shadow-light);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 1px solid var(--border-light);
            position: relative;
            overflow: hidden;
            padding-top: 55px; /* Увеличено для бейджей */
        }
        
        /* В тёмной теме карточки чуть светлее фона */
        .dark-theme .article-item {
            background: #221810; /* промежуточный между walnut-brown и sand-beige */
        }
        
        .article-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px var(--shadow-medium);
        }
        
        /* Новые статьи - персиковый/золотой акцент слева */
        .article-item.new-article {
            border-left: 4px solid var(--new-badge);
        }
        
        /* Прочитанные статьи - кофейный/серый акцент слева */
        .article-item.read {
            border-left: 4px solid var(--read-badge);
        }
        
        /* Бейджи в правом верхнем углу - ИСПРАВЛЕНЫ ОТСТУПЫ (ниже) */
        .article-badge {
            position: absolute;
            top: 45px; /* Спущены ниже чтобы не перекрывались с закладкой */
            right: 10px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            z-index: 2;
        }
        
        .badge-new {
            background: var(--new-badge);
            color: var(--chocolate);
        }
        
        .dark-theme .badge-new {
            color: var(--dark-chocolate);
        }
        
        .badge-read {
            background: var(--read-badge);
            color: white;
        }
        
        /* Язычок закладки для коллекции - ИСПРАВЛЕНЫ ОТСТУПЫ (выше) */
        .badge-collection {
            position: absolute;
            top: 5px; /* Оставлено выше */
            right: 40px; /* Левее бейджа "прочитано" */
            width: 28px;
            height: 28px;
            background: var(--collection-badge);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px 4px 0 4px;
            transform: rotate(45deg);
            transform-origin: bottom right;
            z-index: 3;
            box-shadow: -2px -2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .badge-collection i {
            transform: rotate(-45deg);
            font-size: 14px;
            color: white;
        }
        
        .article-tag {
            display: inline-block;
            padding: 6px 14px;
            background: linear-gradient(135deg, rgba(232, 168, 149, 0.2), rgba(232, 168, 149, 0.2));
            color: var(--chocolate);
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            border: 1px solid var(--border-light);
            position: absolute; /* Делаем тэг абсолютным */
            top: 15px; /* Позиционируем выше */
            left: 20px;
        }
        
        .dark-theme .article-tag {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(212, 175, 55, 0.2));
            color: var(--cream-ivory);
        }
        
        .article-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.4;
            color: var(--text-primary);
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding-right: 70px; /* Место для бейджа и закладки */
        }
        
        .article-preview {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .article-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--milky-coffee);
            padding-top: 15px;
            border-top: 1px solid var(--border-light);
        }
        
        .dark-theme .article-meta {
            color: var(--warm-gray);
        }
        
        /* === МОДАЛЬНОЕ ОКНО (НА ВЕСЬ ЭКРАН) === */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            display: none;
            animation: fadeIn 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-content {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--modal-bg);
            z-index: 1001;
            display: none;
            flex-direction: column;
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }
        
        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal-header {
            padding: 20px;
            position: relative;
            border-bottom: 1px solid var(--border-light);
            background: var(--modal-bg);
            flex-shrink: 0;
        }
        
        /* КРЕСТИК БЕЗ ЗАЛИВКИ И ОБВОДКИ */
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-secondary);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 24px;
            transition: all 0.3s ease;
            z-index: 1002;
            opacity: 0.7;
        }
        
        .modal-close:hover {
            opacity: 1;
            transform: rotate(90deg);
        }
        
        .modal-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.3;
            padding-right: 60px;
            color: var(--text-primary);
            font-family: 'Georgia', serif;
        }
        
        .modal-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
            background: var(--modal-bg);
        }
        
        /* Кастомный скроллбар для модалки */
        .modal-body::-webkit-scrollbar {
            width: 6px;
        }
        
        .modal-body::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .modal-body::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--roasted-peach), var(--milky-coffee));
            border-radius: 3px;
        }
        
        .dark-theme .modal-body::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--gold), var(--warm-gray));
        }
        
        .article-full-content {
            font-size: 17px;
            line-height: 1.7;
            color: var(--text-primary);
            max-width: 800px;
            margin: 0 auto;
        }
        
        .article-full-content h3 {
            font-size: 20px;
            margin: 30px 0 15px;
            font-weight: 600;
            color: var(--chocolate);
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border-light);
            font-family: 'Georgia', serif;
        }
        
        .dark-theme .article-full-content h3 {
            color: var(--gold);
        }
        
        .article-full-content p {
            margin-bottom: 20px;
            text-align: justify;
            text-justify: inter-word;
        }
        
        .article-full-content ul {
            margin: 0 0 20px 20px;
            list-style: none;
        }
        
        .article-full-content li {
            margin-bottom: 12px;
            position: relative;
            padding-left: 24px;
        }
        
        .article-full-content li:before {
            content: "•";
            position: absolute;
            left: 8px;
            color: var(--roasted-peach);
            font-size: 24px;
        }
        
        .dark-theme .article-full-content li:before {
            color: var(--gold);
        }
        
        /* Нумерованные списки - исправлен отступ */
        .article-full-content ol {
            margin: 0 0 20px 40px; /* Увеличен отступ слева */
            padding-left: 10px;
        }
        
        .article-full-content ol li {
            margin-bottom: 12px;
            padding-left: 0; /* Убираем левый отступ для ol li */
        }
        
        .article-full-content ol li:before {
            display: none; /* Убираем точки для ol */
        }
        
        /* Стили для картинок в статьях */
        .article-image {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px var(--shadow-medium);
            border: 1px solid var(--border-light);
        }
        
        .article-image img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s ease;
        }
        
        .article-image:hover img {
            transform: scale(1.02);
        }
        
        .image-caption {
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 8px;
            font-style: italic;
            padding: 0 10px;
        }
        
        .modal-actions {
            padding: 20px;
            border-top: 1px solid var(--border-light);
            background: var(--modal-bg);
            display: flex;
            gap: 12px;
            flex-shrink: 0;
            /* Обе кнопки в одну строку */
            flex-direction: row;
            justify-content: space-between;
        }
        
        /* КНОПКИ КАК "ПОДЕЛИТЬСЯ" (одинаковые) - КОМПАКТНЫЕ */
        .modal-btn {
            flex: 1;
            padding: 12px 16px; /* Уменьшен padding */
            border-radius: 12px;
            border: 2px solid var(--border-light);
            font-size: 14px; /* Уменьшен шрифт */
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px; /* Уменьшен gap */
            background: var(--modal-bg);
            color: var(--text-primary);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 44px; /* Минимальная высота для тач-устройств */
        }
        
        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--shadow-medium);
        }
        
        /* === УВЕДОМЛЕНИЯ === */
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 15px;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            border: 1px solid var(--border-light);
            max-width: 400px;
            width: calc(100% - 40px);
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification-icon {
            font-size: 24px;
            color: var(--roasted-peach);
            flex-shrink: 0;
        }
        
        .dark-theme .notification-icon {
            color: var(--gold);
        }
        
        .notification-content {
            flex: 1;
        }
        
        .notification-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        
        .notification-text {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.4;
        }
        
        .notification-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        
        .notification-close:hover {
            background: rgba(232, 168, 149, 0.1);
            color: var(--text-primary);
        }
        
        .dark-theme .notification-close:hover {
            background: rgba(212, 175, 55, 0.1);
        }
        
        /* === БОКОВОЕ МЕНЮ === */
        .side-menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: none;
            backdrop-filter: blur(3px);
        }
        
        .side-menu-overlay.active {
            display: block;
        }
        
        .side-menu {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: var(--header-bg); /* Цвет шапки для меню */
            z-index: 1001;
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 5px 0 25px rgba(0, 0, 0, 0.2);
        }
        
        .side-menu.active {
            transform: translateX(280px);
        }
        
        .menu-header {
            padding: 25px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, var(--background), var(--header-bg));
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        /* Слово "Меню" в боковом меню - gold цвет в темной теме */
        .menu-header h2 {
            font-family: 'Georgia', serif;
            font-weight: 300;
            font-size: 20px;
            color: var(--chocolate); /* Светлый цвет в светлой теме */
        }
        
        .dark-theme .menu-header h2 {
            color: #D4AF37; /* Gold цвет в темной теме как указано */
        }
        
        .menu-buttons {
            padding: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .menu-btn {
            width: 100%;
            padding: 22px 25px;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-primary);
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 18px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            text-align: left;
            border-radius: 0;
            position: relative;
        }
        
        .menu-btn:last-child {
            border-bottom: none;

                Telegram.WebApp.openLink(telegramShareUrl);
            } 
            // Для браузеров с поддержкой Web Share API
            else if (navigator.share) {
                navigator.share({
                    title: currentArticle.title,
                    text: currentArticle.preview,
                    url: telegramBotLink
                })
                .then(() => console.log('Успешный шаринг'))
                .catch((error) => {
                    console.log('Ошибка шаринга:', error);
                    copyToClipboard(shareText);
                });
            } 
            // Fallback - копируем текст с ссылкой
            else {
                copyToClipboard(shareText);
            }
        }
        
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showNotification('Скопировано', 'Ссылка на статью скопирована в буфер обмена');
            }).catch(() => {
                // Старый способ для старых браузеров
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showNotification('Скопировано', 'Ссылка на статью скопирована');
            });
        }

        async function checkForNewArticles() {
            // Проверяем не чаще чем раз в час
            const lastCheck = parseInt(localStorage.getItem(LAST_CHECK_KEY) || '0');
            const now = Date.now();
            
            if (now - lastCheck < 60 * 60 * 1000) {
                return; // Не проверяем, если прошло меньше часа
            }
            
            // Сохраняем время проверки
            localStorage.setItem(LAST_CHECK_KEY, now.toString());
            
            // Проверяем настройки уведомлений
            const notificationsEnabled = localStorage.getItem(NOTIFICATION_PREF_KEY) === 'true';
            
            if (!notificationsEnabled) {
                return; // Уведомления отключены
            }
            
            // В реальном приложении здесь будет запрос к API
            // Для демонстрации имитируем получение новых статей
            setTimeout(() => {
                // С вероятностью 30% показываем уведомление о новой статье
                if (Math.random() < 0.3) {
                    const titles = [
                        "Новая статья: Весенние тренды в парфюмерии 2026",
                        "Вышла статья: Как создаются нишевые ароматы",

function getArticleCollection() {
    try {
        const collection = localStorage.getItem('scentme_collection_articles');
        return collection ? JSON.parse(collection) : [];
    } catch (e) {
        return [];
    }
}

function saveArticleCollection(collection) {
    localStorage.setItem('scentme_collection_articles', JSON.stringify(collection));
}

function isArticleInCollection(articleId) {
    const collection = getArticleCollection();
    return collection.includes(articleId);
}
// Функция для поиска и открытия статьи
function findAndOpenArticleFromCollection() {
    try {
        const openArticleData = localStorage.getItem('open_article_data');
        if (!openArticleData) return;
        
        const data = JSON.parse(openArticleData);
        
        // Очищаем сразу, чтобы не открывалось при следующей загрузке
        localStorage.removeItem('open_article_data');
        
        // Ищем статью по названию (самый надежный способ)
        const articles = getCachedArticles()?.articles || [];
        
        // Сначала ищем по ID (если есть)
        if (data.id) {
            const articleById = articles.find(a => a.id == data.id);
            if (articleById) {
                openArticleModal(articleById.id);
                scrollToArticleInList(articleById.id);
                return;
            }
        }
        
        // Если не нашли по ID, ищем по названию
        if (data.name) {
            // Ищем точное совпадение
            let article = articles.find(a => 
                a.title.toLowerCase() === data.name.toLowerCase()
            );
            
            // Если нет точного совпадения, ищем частичное
            if (!article) {
                article = articles.find(a => 
                    a.title.toLowerCase().includes(data.name.toLowerCase()) ||
                    data.name.toLowerCase().includes(a.title.toLowerCase())
                );
            }
            
            if (article) {
                openArticleModal(article.id);
                scrollToArticleInList(article.id);
            }
        }
        
    } catch (e) {
        console.error('Ошибка поиска статьи:', e);
    }
}

// Функция для прокрутки к статье в списке
function scrollToArticleInList(articleId) {
    setTimeout(() => {
        const articleElement = document.querySelector(`[data-article-id="${articleId}"]`);
        if (articleElement) {
            articleElement.scrollIntoView({
                behavior: 'smooth',
                block: 'center'
            });
            
            // Добавляем подсветку
            articleElement.style.backgroundColor = 'rgba(232, 168, 149, 0.2)';
            articleElement.style.transition = 'background-color 0.5s ease';
            
            setTimeout(() => {
                articleElement.style.backgroundColor = '';
            }, 2000);
        }
    }, 500); // Даем время для загрузки списка
}

function toggleCollectArticle() {
    // Проверяем, есть ли открытая статья
    if (!currentArticle) {
        console.log('Нет открытой статьи');
        return;
    }
    
    const articleId = currentArticle.id;
    const collection = getArticleCollection();
    const isInCollection = collection.includes(articleId);
    
    if (isInCollection) {
        // УДАЛЯЕМ из коллекции
        const index = collection.indexOf(articleId);
        collection.splice(index, 1);
        saveArticleCollection(collection);
        
        // Обновляем кнопку
        updateCollectButton(false);
        
        // Обновляем значок на карточке
        updateArticleBadge(articleId, false);
        
        // Показываем уведомление
        showNotification('Удалено из коллекции', 'Статья удалена из коллекции');
        
        console.log('Статья удалена из коллекции, ID:', articleId);
    } else {
        // ДОБАВЛЯЕМ в коллекцию
        collection.push(articleId);
        saveArticleCollection(collection);
        
        // Обновляем кнопку
        updateCollectButton(true);
        
        // Обновляем значок на карточке
        updateArticleBadge(articleId, true);
        
        // Показываем уведомление
        showNotification('Добавлено в коллекцию', 'Статья сохранена в коллекцию');
        
        console.log('Статья добавлена в коллекцию, ID:', articleId);
    }
    
    console.log('Текущая коллекция:', collection);
}

function updateCollectButton(isInCollection) {
    const button = document.getElementById('collectArticleBtn');
    if (!button) return;
    
    if (isInCollection) {
        button.innerHTML = '<i class="bi bi-bookmark-fill"></i> В коллекции';

}

// 4. ОБНОВЛЕНИЕ ЗНАЧКА НА КАРТОЧКЕ СТАТЬИ
function updateArticleBadge(articleId, showBadge) {
    // Находим карточку статьи
    const articleCard = document.querySelector(`.article-item[data-article-id="${articleId}"]`);
    if (!articleCard) return;
    
    // Ищем существующий значок
    let badge = articleCard.querySelector('.badge-collection');
    
    if (showBadge) {
        // Добавляем значок, если его нет
        if (!badge) {
            badge = document.createElement('div');
            badge.className = 'badge-collection';
            badge.innerHTML = '<i class="bi bi-bookmark-fill"></i>';
            articleCard.appendChild(badge);
        }
    } else {
        // Удаляем значок, если он есть
        if (badge) {
            badge.remove();
        }
    }
}
