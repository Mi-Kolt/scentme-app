<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scentmé - Коллекция</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        /* ===== СБРОС СТИЛЕЙ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* ===== СВЕТЛАЯ ТЕМА ===== */
        :root {
            /* Цвета светлой темы */
            --chocolate: #684627;
            --roasted-peach: #E8A895;
            --whole-wheat: #EFD2B0;
            --milky-coffee: #B59272;
            --cream: #FFE4B8;
            --peony-pink: #E8A8B8;
            --peony-dark-pink: #C97A8D;
            --light-beige: #FFF8ED;
            
            /* Основные переменные светлой темы */
            --bg-primary: #FFF8ED;
            --bg-card: white;
            --text-primary: #5C4A36;
            --text-secondary: #7D6B57;
            --border-color: rgba(104, 70, 39, 0.3);
            --shadow-light: rgba(104, 70, 39, 0.1);
            --shadow-medium: rgba(104, 70, 39, 0.2);
            --button-bg: linear-gradient(135deg, var(--roasted-peach) 0%, var(--whole-wheat) 100%);
            --button-text: #684627;
            --title-color: #684627;
            --header-bg: white;
            --card-bg: white;
            --scrollbar-track: rgba(232, 168, 149, 0.1);
            --scrollbar-thumb: linear-gradient(135deg, var(--roasted-peach), var(--milky-coffee));
            --tab-bg: white;
            --tab-active-bg: rgba(232, 168, 149, 0.08);
            --modal-bg: white;
            --menu-bg: white;
            
            /* Новые переменные для статей */
            --new-badge: #E8A895;
            --read-badge: #B59272;
            --collection-badge: #E8A895;
        }
        
        /* ===== ТЕМНАЯ ТЕМА ===== */
        .dark-theme {
            /* Цвета темной темы */
            --dark-chocolate: #3D1F12;
            --walnut-brown: #584738;
            --sand-beige: #98755B;
            --cream-ivory: #F1EADA;
            --pure-white: #FFFFFF;
            --gold: #D4AF37;
            --light-gold: #F4E4A6;
            --dark-beige: #D8C9B0;
            --warm-gray: #A99E8B;
            
            /* Основные переменные темной темы */
            --bg-primary: #2A1A0F;
            --bg-card: rgba(30, 23, 18, 0.95);
            --text-primary: var(--light-gold);
            --text-secondary: rgba(244, 228, 166, 0.9);
            --border-color: rgba(212, 175, 55, 0.25);
            --shadow-light: rgba(0, 0, 0, 0.2);
            --shadow-medium: rgba(0, 0, 0, 0.3);
            --button-bg: linear-gradient(135deg, rgba(61, 31, 18, 0.9), rgba(88, 71, 56, 0.9));
            --button-text: var(--light-gold);
            --title-color: var(--light-gold);
            --header-bg: rgba(30, 23, 18, 0.95);
            --card-bg: rgba(30, 23, 18, 0.9);
            --scrollbar-track: rgba(212, 175, 55, 0.1);
            --scrollbar-thumb: linear-gradient(135deg, rgba(212, 175, 55, 0.7), rgba(244, 228, 166, 0.7));
            --tab-bg: rgba(30, 23, 18, 0.95);
            --tab-active-bg: rgba(212, 175, 55, 0.15);
            --modal-bg: rgba(30, 23, 18, 0.98);
            --menu-bg: rgba(30, 23, 18, 0.98);
            
            /* Новые переменные для статей в темной теме */
            --new-badge: #D4AF37;
            --read-badge: #A99E8B;
            --collection-badge: #D4AF37;
        }
        
        /* ===== ОСНОВНЫЕ СТИЛИ ===== */
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        /* ===== ОСНОВНОЙ КОНТЕЙНЕР ===== */
        .app-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        
        /* ===== ШАПКА ВЕРХНЕГО УРОВНЯ (sticky) ===== */
        .main-header {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            background: var(--header-bg);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 15px var(--shadow-light);
            transition: all 0.3s ease;
        }
        
        /* Кнопка меню */
        .menu-toggle {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--title-color);
            cursor: pointer;
            padding: 5px;
            opacity: 0.8;
            transition: all 0.3s ease;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }
        
        .menu-toggle:hover {
            opacity: 1;
            background: rgba(104, 70, 39, 0.1);
        }
        
        .dark-theme .menu-toggle:hover {
            background: rgba(212, 175, 55, 0.1);
        }
        
        /* Заголовок */
        .main-title {
            font-size: 20px;
            color: var(--title-color);
            font-weight: 300;
            font-family: 'Georgia', serif;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }
        
        /* Аватар профиля */
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            opacity: 0.8;
            transition: opacity 0.3s ease;
            position: relative;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .profile-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--roasted-peach), var(--whole-wheat));
            color: var(--chocolate);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px var(--shadow-light);
            transition: all 0.3s ease;
        }
        
        .dark-theme .profile-avatar {
            background: linear-gradient(135deg, var(--sand-beige), var(--gold));
            color: var(--dark-chocolate);
        }
        
        .profile-btn:hover .profile-avatar {
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--shadow-medium);
        }
        
        /* ===== ПАНЕЛЬ УПРАВЛЕНИЯ ===== */
        .control-panel {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            border-bottom: 1px solid var(--border-color);
            background: var(--header-bg);
            box-shadow: 0 1px 10px var(--shadow-light);
            gap: 12px;
            height: 50px;
            transition: all 0.3s ease;
        }
        
        /* Поиск */
        .search-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: flex-end;
            height: 38px;
            cursor: pointer;
            min-width: 0;
            padding-bottom: 0;
        }
        
        .search-magnifier {
            position: absolute;
            right: 0;
            bottom: 1px;
            width: 20px;
            height: 20px;
            z-index: 2;
            pointer-events: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .search-magnifier::before {
            content: "";
            position: absolute;
            width: 14px;
            height: 14px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            top: 0;
            left: 0;
            opacity: 0.8;
            transition: all 0.3s ease;
        }
        
        .search-magnifier::after {
            content: "";
            position: absolute;
            width: 8px;
            height: 2px;
            background: var(--border-color);
            transform: rotate(45deg);
            top: 14px;
            left: 11px;
            opacity: 0.8;
            transition: all 0.3s ease;
        }
        
        .search-line {
            flex: 1;
            height: 1.5px;
            background: var(--border-color);
            position: relative;
            transition: all 0.3s ease;
            margin-right: 25px;
            margin-left: 0;
            align-self: flex-end;
            margin-bottom: 0;
        }
        
        .search-line.active {
            height: 2px;
            background: var(--title-color);
        }
        
        .search-container.active .search-magnifier::before {
            border-color: var(--title-color);
            opacity: 1;
        }
        
        .search-container.active .search-magnifier::after {
            background: var(--title-color);
            opacity: 1;
        }
        
        .search-input {
            position: absolute;
            bottom: 6px;
            left: 0;
            right: 25px;
            padding: 0;
            background: transparent;
            border: none;
            font-size: 14px;
            color: var(--text-primary);
            opacity: 0;
            transform: translateY(2px);
            pointer-events: none;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', system-ui, sans-serif;
            z-index: 100;
            outline: none;
        }
        
        .search-input.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }
        
        .search-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.7;
        }
        
        /* ===== ТАБЫ КОЛЛЕКЦИИ ===== */
        .collection-tabs {
            display: flex;
            background: var(--tab-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 105px;
            z-index: 90;
            transition: all 0.3s ease;
        }
        
        .collection-tab {
            flex: 1;
            padding: 15px 20px;
            text-align: center;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: var(--text-secondary);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', system-ui, sans-serif;
            position: relative;
        }
        
        .collection-tab.active {
            color: var(--title-color);
            border-bottom-color: var(--roasted-peach);
        }
        
        .dark-theme .collection-tab.active {
            border-bottom-color: var(--gold);
        }
        
        .collection-tab:hover {
            color: var(--title-color);
            background: var(--tab-active-bg);
        }
        
        .tab-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--peony-pink);
            color: white;
            font-size: 11px;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }
        
        .dark-theme .tab-badge {
            background: var(--gold);
            color: var(--dark-chocolate);
        }
        
        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
            background: var(--bg-primary);
            transition: background-color 0.3s ease;
        }
        
        /* Кастомный скроллбар в цветовой гамме */
        .content-area::-webkit-scrollbar {
            width: 8px;
        }
        
        .content-area::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 4px;
            margin: 5px;
        }
        
        .content-area::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
            border: 2px solid var(--bg-primary);
        }
        
        .content-area::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, var(--milky-coffee), var(--roasted-peach));
        }
        
        .dark-theme .content-area::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, rgba(244, 228, 166, 0.8), rgba(212, 175, 55, 0.8));
        }
        
        /* Сетка карточек для ароматов */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* Список статей как в articles.html */
        .articles-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        
        .article-item {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px var(--shadow-light);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            padding-top: 55px; /* Увеличено для бейджей */
        }
        
        .dark-theme .article-item {
            background: #221810; /* промежуточный между walnut-brown и sand-beige */
        }
        
        .article-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px var(--shadow-medium);
        }
        
        /* Новые статьи - персиковый/золотой акцент слева */
        .article-item.new-article {
            border-left: 4px solid var(--new-badge);
        }
        
        /* Прочитанные статьи - кофейный/серый акцент слева */
        .article-item.read {
            border-left: 4px solid var(--read-badge);
        }
        
        /* Бейджи в правом верхнем углу */
        .article-badge {
            position: absolute;
            top: 45px; /* Спущены ниже чтобы не перекрывались с закладкой */
            right: 10px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            z-index: 2;
        }
        
        .badge-new {
            background: var(--new-badge);
            color: var(--chocolate);
        }
        
        .dark-theme .badge-new {
            color: var(--dark-chocolate);
        }
        
        .badge-read {
            background: var(--read-badge);
            color: white;
        }
        
        /* Язычок закладки для коллекции */
        .badge-collection {
            position: absolute;
            top: 5px; /* Оставлено выше */
            right: 40px; /* Левее бейджа "прочитано" */
            width: 28px;
            height: 28px;
            background: var(--collection-badge);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px 4px 0 4px;
            transform: rotate(45deg);
            transform-origin: bottom right;
            z-index: 3;
            box-shadow: -2px -2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .badge-collection i {
            transform: rotate(-45deg);
            font-size: 14px;
            color: white;
        }
        
        .article-tag {
            display: inline-block;
            padding: 6px 14px;
            background: linear-gradient(135deg, rgba(232, 168, 149, 0.2), rgba(232, 168, 149, 0.2));
            color: var(--chocolate);
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            position: absolute; /* Делаем тэг абсолютным */
            top: 15px; /* Позиционируем выше */
            left: 20px;
        }
        
        .dark-theme .article-tag {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(212, 175, 55, 0.2));
            color: var(--cream-ivory);
        }
        
        .article-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.4;
            color: var(--text-primary);
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding-right: 70px; /* Место для бейджа и закладки */
        }
        
        .article-preview {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .article-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--milky-coffee);
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }
        
        .dark-theme .article-meta {
            color: var(--warm-gray);
        }
        
        /* Блок вкладки */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        
        .tab-content.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* ===== КАРТОЧКИ МАСЕЛ ===== */
        .oil-card-container {
            width: 100%;
            max-width: 320px;
            height: 450px;
            perspective: 1000px;
            margin: 0 auto;
        }
        
        .oil-card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(50, 50, 93, 0.1), 0 5px 15px rgba(0, 0, 0, 0.07);
        }
        
        .oil-card.flipped {
            transform: rotateY(180deg);
        }
        
        .oil-card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .category-universal .oil-card-front,
        .category-universal .oil-card-back {
            border: 2px solid var(--milky-coffee);
        }
        
        .category-rare .oil-card-front,
        .category-rare .oil-card-back {
            border: 2px solid var(--chocolate);
        }
        
        .category-legendary .oil-card-front,
        .category-legendary .oil-card-back {
            border: 2px solid var(--peony-dark-pink);
        }
        
        .dark-theme .category-universal .oil-card-front,
        .dark-theme .category-universal .oil-card-back {
            border: 2px solid var(--sand-beige);
        }
        
        .dark-theme .category-rare .oil-card-front,
        .dark-theme .category-rare .oil-card-back {
            border: 2px solid var(--gold);
        }
        
        .dark-theme .category-legendary .oil-card-front,
        .dark-theme .category-legendary .oil-card-back {
            border: 2px solid var(--light-gold);
        }
        
        .oil-card-back {
            transform: rotateY(180deg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
        }
        
        .oil-card-image {
            height: 80%;
            background-size: cover;
            background-position: center;
            position: relative;
            background-color: #f5f1e9;
        }
        
        .dark-theme .oil-card-image {
            background-color: #2A1A0F;
        }
        
        .oil-collection-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
        }
        
        .oil-heart-icon {
            font-size: 36px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-block;
            line-height: 1;
        }
        
        .oil-heart-icon.empty {
            color: rgba(104, 70, 39, 0.3);
            opacity: 0.5;
        }
        
        .dark-theme .oil-heart-icon.empty {
            color: rgba(244, 228, 166, 0.3);
        }
        
        .oil-heart-icon.filled {
            color: var(--peony-dark-pink);
            transform: scale(1.2);
        }
        
        .dark-theme .oil-heart-icon.filled {
            color: var(--light-gold);
        }
        
        .oil-card-title {
            height: 20%;
            padding: 10px 20px 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--card-bg);
        }
        
        .oil-card-name {
            font-size: 24px;
            font-weight: 700;
            color: var(--title-color);
            margin-bottom: 3px;
            text-align: center;
            line-height: 1.1;
        }
        
        .oil-card-latin {
            font-size: 14px;
            font-style: italic;
            color: var(--text-secondary);
            margin-bottom: 5px;
            text-align: center;
        }
        
        .oil-back-content {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .oil-back-header {
            margin-bottom: 15px;
            text-align: center;
            flex-shrink: 0;
        }
        
        .oil-back-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--title-color);
            margin-bottom: 3px;
            text-align: center;
        }
        
        .oil-back-category {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(232, 168, 149, 0.2);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--title-color);
            margin-bottom: 5px;
            text-align: center;
        }
        
        .dark-theme .oil-back-category {
            background: rgba(212, 175, 55, 0.2);
        }
        
        .oil-back-content-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        
        .oil-back-description {
            color: var(--text-primary);
            line-height: 1.5;
            font-size: 15px;
            text-align: justify;
            text-justify: inter-word;
            margin-bottom: 20px;
            flex-shrink: 0;
            font-weight: 400;
        }
        
        .oil-properties-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        
        .oil-property {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 32px;
        }
        
        .oil-property-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--title-color);
            flex-shrink: 0;
            border: 1.5px solid var(--title-color);
            box-shadow: none;
        }
        
        .oil-property-text {
            font-size: 13px;
            color: var(--text-primary);
            text-align: left;
            line-height: 1.2;
            font-weight: 500;
            flex: 1;
        }
        
        .oil-details-btn-back {
            display: block;
            width: 85%;
            padding: 12px;
            background: var(--button-bg);
            color: var(--button-text);
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            text-decoration: none;
            margin-top: auto;
            margin-left: auto;
            margin-right: auto;
            flex-shrink: 0;
        }
        
        .oil-details-btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(50, 50, 93, 0.1), 0 3px 6px rgba(0, 0, 0, 0.08);
        }
        
        /* ===== КАРТОЧКИ ПАРФЮМОВ ===== */
        .perfume-card-container {
            width: 100%;
            max-width: 320px;
            height: 450px;
            perspective: 1000px;
            margin: 0 auto;
        }
        
        .perfume-card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(50, 50, 93, 0.1), 0 5px 15px rgba(0, 0, 0, 0.07);
        }
        
        .perfume-card.flipped {
            transform: rotateY(180deg);
        }
        
        .perfume-card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .perfume-card-front,
        .perfume-card-back {
            border: 2px solid var(--milky-coffee);
        }
        
        .perfume-category-rare .perfume-card-front,
        .perfume-category-rare .perfume-card-back {
            border: 2px solid var(--chocolate);
        }
        
        .perfume-category-legendary .perfume-card-front,
        .perfume-category-legendary .perfume-card-back {
            border: 2px solid var(--peony-dark-pink);
        }
        
        .dark-theme .perfume-card-front,
        .dark-theme .perfume-card-back {
            border: 2px solid var(--sand-beige);
        }
        
        .dark-theme .perfume-category-rare .perfume-card-front,
        .dark-theme .perfume-category-rare .perfume-card-back {
            border: 2px solid var(--gold);
        }
        
        .dark-theme .perfume-category-legendary .perfume-card-front,
        .dark-theme .perfume-category-legendary .perfume-card-back {
            border: 2px solid var(--light-gold);
        }
        
        .perfume-card-back {
            transform: rotateY(180deg);
            padding: 0;
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
        }
        
        .perfume-card-image {
            height: 80%;
            background-size: cover;
            background-position: center;
            position: relative;
            background-color: #f5f1e9;
        }
        
        .dark-theme .perfume-card-image {
            background-color: #2A1A0F;
        }
        
        .perfume-collection-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
        }
        
        .perfume-heart-icon {
            font-size: 36px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-block;
            line-height: 1;
        }
        
        .perfume-heart-icon.empty {
            color: rgba(104, 70, 39, 0.3);
            opacity: 0.5;
        }
        
        .dark-theme .perfume-heart-icon.empty {
            color: rgba(244, 228, 166, 0.3);
        }
        
        .perfume-heart-icon.filled {
            color: var(--peony-dark-pink);
            transform: scale(1.2);
        }
        
        .dark-theme .perfume-heart-icon.filled {
            color: var(--light-gold);
        }
        
        .perfume-card-title {
            height: 20%;
            padding: 10px 20px 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--card-bg);
            position: relative;
        }
        
        .perfume-card-name {
            font-size: 22px;
            font-weight: 700;
            color: var(--title-color);
            margin-bottom: 8px;
            text-align: center;
            line-height: 1.1;
        }
        
        .perfume-card-direction {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(232, 168, 149, 0.2);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--title-color);
            margin: 0 auto;
            text-align: center;
        }
        
        .dark-theme .perfume-card-direction {
            background: rgba(212, 175, 55, 0.2);
        }
        
        /* Обратная сторона парфюма */
        .perfume-back-content {
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 18px;
        }
        
        /* Кастомный скроллбар для карточки парфюма */
        .perfume-back-content::-webkit-scrollbar {
            width: 6px;
        }
        
        .perfume-back-content::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 4px;
            margin: 5px;
        }
        
        .perfume-back-content::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
            border: 2px solid var(--card-bg);
        }
        
        .perfume-back-content::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, var(--milky-coffee), var(--roasted-peach));
        }
        
        .dark-theme .perfume-back-content::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, rgba(244, 228, 166, 0.8), rgba(212, 175, 55, 0.8));
        }
        
        .perfume-back-header {
            margin-bottom: 12px;
            text-align: center;
            flex-shrink: 0;
        }
        
        .perfume-back-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--title-color);
            margin-bottom: 8px;
            text-align: center;
        }
        
        .perfume-back-category {
            display: inline-block;
            padding: 5px 14px;
            background: rgba(232, 168, 149, 0.2);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--title-color);
            margin-bottom: 15px;
            text-align: center;
        }
        
        .dark-theme .perfume-back-category {
            background: rgba(212, 175, 55, 0.2);
        }
        
        .perfume-back-description {
            color: var(--text-primary);
            line-height: 1.5;
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
            flex-shrink: 0;
            font-weight: 400;
            padding: 0 10px;
        }
        
        /* ПИРАМИДКА НОТ (перевернутая) */
        .perfume-pyramid-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        
        .perfume-pyramid-layer {
            width: 90%;
            padding: 8px 12px;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }
        
        .perfume-pyramid-top {
            background: transparent;
            border: 2px solid var(--milky-coffee);
            border-radius: 10px 10px 5px 5px;
            margin-bottom: -2px;
            z-index: 3;
            width: 70%;
            color: var(--text-secondary);
        }
        
        .dark-theme .perfume-pyramid-top {
            border: 2px solid var(--sand-beige);
            color: var(--sand-beige);
        }
        
        .perfume-pyramid-heart {
            background: var(--milky-coffee);
            border: 2px solid var(--milky-coffee);
            border-radius: 10px;
            margin-bottom: -2px;
            z-index: 2;
            width: 85%;
            color: white;
        }
        
        .dark-theme .perfume-pyramid-heart {
            background: var(--sand-beige);
            border: 2px solid var(--sand-beige);
        }
        
        .perfume-pyramid-base {
            background: var(--roasted-peach);
            border: 2px solid var(--roasted-peach);
            border-radius: 5px 5px 10px 10px;
            z-index: 1;
            width: 100%;
            color: white;
        }
        
        .dark-theme .perfume-pyramid-base {
            background: var(--gold);
            border: 2px solid var(--gold);
        }
        
        .perfume-pyramid-label {
            font-size: 9px;
            margin-bottom: 2px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .perfume-pyramid-notes {
            font-size: 10px;
            line-height: 1.3;
        }
        
        /* Блок стойкости и типа */
        .perfume-specs-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
            flex-shrink: 0;
        }
        
        .perfume-spec-block {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 12px;
            background: rgba(232, 168, 149, 0.1);
        }
        
        .dark-theme .perfume-spec-block {
            background: rgba(212, 175, 55, 0.1);
        }
        
        .perfume-spec-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 5px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .perfume-spec-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--title-color);
            font-family: 'Georgia', serif;
        }
        
        .perfume-spec-unit {
            font-size: 11px;
            color: var(--text-secondary);
            margin-left: 2px;
        }
        
        /* Кнопка "Подробнее" */
        .perfume-details-btn-back {
            display: block;
            width: 100%;
            padding: 12px;
            background: var(--button-bg);
            color: var(--button-text);
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            text-decoration: none;
            flex-shrink: 0;
            margin-top: auto;
        }
        
        .perfume-details-btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(50, 50, 93, 0.1), 0 3px 6px rgba(0, 0, 0, 0.08);
        }
        
        /* ===== УВЕДОМЛЕНИЕ ===== */
        .notification {
            position: fixed;
            top: 100px;
            right: 20px;
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 15px;
            transform: translateX(120%);
            transition: transform 0.3s ease;
            border: 1px solid var(--border-color);
            max-width: 400px;
            word-wrap: break-word;
            white-space: normal;
            overflow: visible;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification-icon {
            font-size: 24px;
            color: var(--peony-dark-pink);
            flex-shrink: 0;
        }
        
        .dark-theme .notification-icon {
            color: var(--light-gold);
        }
        
        .notification-text {
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 500;
            flex: 1;
            line-height: 1.4;
        }
        
        /* ===== МОДАЛЬНЫЕ ОКНА ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            padding: 20px;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .details-modal {
            background: var(--modal-bg);
            border-radius: 20px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            animation: modalAppear 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes modalAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        .modal-header {
            padding: 25px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-primary), var(--modal-bg));
        }
        
        .modal-title {
            font-size: 24px;
            color: var(--title-color);
            font-weight: 300;
            font-family: 'Georgia', serif;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 32px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 5px;
            opacity: 0.7;
            transition: opacity 0.3s ease;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }
        
        .modal-close:hover {
            opacity: 1;
            background: rgba(104, 70, 39, 0.1);
        }
        
        .dark-theme .modal-close:hover {
            background: rgba(212, 175, 55, 0.1);
        }
        
        .modal-content {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            padding: 30px;
        }
        
        /* Кастомный скроллбар модалки */
        .modal-content::-webkit-scrollbar {
            width: 8px;
        }
        
        .modal-content::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 4px;
            margin: 5px;
        }
        
        .modal-content::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
            border: 2px solid var(--modal-bg);
        }
        
        .modal-content::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, var(--milky-coffee), var(--roasted-peach));
        }
        
        .dark-theme .modal-content::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, rgba(244, 228, 166, 0.8), rgba(212, 175, 55, 0.8));
        }
        
        /* Контент модалки для масел */
        .oil-modal-content {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .oil-modal-header {
            text-align: center;
            margin-bottom: 10px;
        }
        
        .oil-modal-title {
            font-size: 28px;
            color: var(--title-color);
            margin-bottom: 10px;
            font-family: 'Georgia', serif;
            font-weight: 300;
        }
        
        .oil-modal-category {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(232, 168, 149, 0.2);
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            color: var(--title-color);
            margin-bottom: 15px;
        }
        
        .dark-theme .oil-modal-category {
            background: rgba(212, 175, 55, 0.2);
        }
        
        .oil-modal-description {
            color: var(--text-primary);
            line-height: 1.6;
            font-size: 16px;
            text-align: justify;
            margin-bottom: 20px;
        }
        
        .oil-modal-section {
            margin-bottom: 25px;
        }
        
        .modal-section-title {
            font-size: 18px;
            color: var(--title-color);
            margin-bottom: 15px;
            font-family: 'Georgia', serif;
            font-weight: 300;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 5px;
        }
        
        .modal-tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        
        .modal-tag {
            background: linear-gradient(135deg, rgba(232, 168, 149, 0.2), rgba(239, 210, 176, 0.2));
            color: var(--title-color);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid var(--border-color);
        }
        
        .dark-theme .modal-tag {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(244, 228, 166, 0.2));
        }
        
        .oil-modal-properties-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 10px;
        }
        
        .oil-modal-property {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(232, 168, 149, 0.1);
        }
        
        .dark-theme .oil-modal-property {
            background: rgba(212, 175, 55, 0.1);
        }
        
        .oil-modal-property-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--card-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--title-color);
            border: 2px solid var(--title-color);
        }
        
        .oil-modal-property-text {
            flex: 1;
            font-size: 15px;
            color: var(--text-primary);
            font-weight: 500;
        }
        
        /* Контент модалки для парфюмов */
        .perfume-modal-content {
            display: flex;
            flex-direction: column;
        }
        
        .perfume-carousel-section {
            padding: 30px;
            border-bottom: 1px solid var(--border-color);
            background: var(--modal-bg);
        }
        
        .perfume-carousel-container {
            position: relative;
            width: 100%;
            height: 300px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        .perfume-carousel-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .perfume-carousel-slide.active {
            opacity: 1;
        }
        
        .perfume-carousel-nav {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 8px;
            z-index: 10;
        }
        
        .perfume-carousel-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .perfume-carousel-dot.active {
            background: white;
            transform: scale(1.2);
        }
        
        .perfume-carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.8);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            color: var(--title-color);
            z-index: 10;
            transition: all 0.3s ease;
        }
        
        .perfume-carousel-btn:hover {
            background: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .perfume-carousel-btn.prev {
            left: 15px;
        }
        
        .perfume-carousel-btn.next {
            right: 15px;
        }
        
        .perfume-info-section {
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        .perfume-info-column {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .perfume-info-block h3 {
            font-size: 18px;
            color: var(--title-color);
            margin-bottom: 12px;
            font-family: 'Georgia', serif;
            font-weight: 300;
        }
        
        .perfume-info-text {
            color: var(--text-primary);
            line-height: 1.6;
            font-size: 15px;
        }
        
        .perfume-specs-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        .perfume-spec-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .perfume-spec-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .perfume-spec-value {
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 600;
        }
        
        .perfume-stores-block {
            background: rgba(232, 168, 149, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-top: 10px;
        }
        
        .dark-theme .perfume-stores-block {
            background: rgba(212, 175, 55, 0.1);
        }
        
        .perfume-stores-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        
        .perfume-store-badge {
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
        }

    <script>
    // ===== ИНИЦИАЛИЗАЦИЯ =====
    document.addEventListener('DOMContentLoaded', function() {
        initializeTheme();
        renderMenuContent();
        setupSearch();
        loadCollectionData();
    });

    // ===== ТЕМА =====
    function initializeTheme() {
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-theme');
        }
    }

    // ===== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ =====
    let searchQuery = '';
    let currentTab = 'scents';
    let allScents = [];
    let allArticles = [];
let currentDetailItemId = null;
let currentDetailItemType = null;

    // ===== ДАННЫЕ КОЛЛЕКЦИИ =====
    async function loadCollectionData() {
        console.log('=== НАЧИНАЕМ ЗАГРУЗКУ КОЛЛЕКЦИИ ===');
        
        try {
            // Загружаем данные параллельно
            await Promise.all([
                loadScentsFromCollection(),
                loadArticlesFromCollection()
            ]);
            
            console.log('Данные загружены:');
            console.log('- Ароматы:', allScents.length);
            console.log('- Статьи:', allArticles.length);
            
            // Обновляем интерфейс
            updateDisplay();
            updateTabBadges();
            
        } catch (error) {
            console.error('Ошибка при загрузке коллекции:', error);
        }
    }

   function loadScentsFromCollection() {
    return new Promise((resolve) => {
        try {
            // Получаем ID ароматов из коллекции
            const savedScents = localStorage.getItem('scentme_collection_scents');
            const scentIds = savedScents ? JSON.parse(savedScents) : [];
            
            console.log('ID ароматов в коллекции:', scentIds);
            
            if (scentIds.length === 0) {
                allScents = [];
                console.log('Нет ароматов в коллекции');
                resolve();
                return;
            }
            
            // Получаем данные из нескольких источников
            let scentsData = [];
            
            // 1. Попробуем из кэша библиотеки
            const libraryCache = localStorage.getItem('scentme_library_cache');
            if (libraryCache) {
                try {
                    const cache = JSON.parse(libraryCache);
                    if (cache.oils || cache.perfumes) {
                        scentsData = [
                            ...(cache.oils || []).map(oil => ({ ...oil, type: 'oil' })),
                            ...(cache.perfumes || []).map(perfume => ({ ...perfume, type: 'perfume' }))
                        ];
                        console.log('Загружено из кэша библиотеки:', scentsData.length);
                    }
                } catch (e) {
                    console.warn('Ошибка парсинга кэша библиотеки:', e);
                }
            }
            
            // 2. Если кэш пуст, попробуем получить из отдельных сохраненных продуктов
            if (scentsData.length === 0) {
                console.log('Пробуем загрузить из сохраненных продуктов...');
                scentsData = scentIds
                    .map(id => {
                        try {
                            const productData = localStorage.getItem(`scentme_product_scent_${id}`);
                            if (productData) {
                                const parsed = JSON.parse(productData);
                                return {
                                    ...parsed,
                                    type: id <= 100 ? 'oil' : 'perfume',
                                    collection: true
                                };
                            }
                        } catch (e) {
                            console.warn('Ошибка загрузки продукта:', id, e);
                        }
                        return null;
                    })
                    .filter(item => item !== null);
                
                console.log('Загружено из сохраненных продуктов:', scentsData.length);
            }
            
            // 3. Если всё ещё пусто, создаем базовую структуру
            if (scentsData.length === 0 && scentIds.length > 0) {
                console.log('Создаем базовую структуру...');
                scentsData = scentIds.map(id => ({
                    id: id,
                    name: `Аромат #${id}`,
                    type: id <= 100 ? 'oil' : 'perfume',
                    category: 'universal',
                    image: id <= 100 ? 
                        'https://images.unsplash.com/photo-1561024356-9d4c5df2e69a?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80' :
                        'https://images.unsplash.com/photo-1541643600914-78b084683601?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
                    description: 'Описание временно недоступно',
                    collection: true
                }));
            }
            
            // Фильтруем только те, что есть в коллекции
            allScents = scentsData.filter(scent => scentIds.includes(scent.id));
            
            console.log('Итоговые ароматы в коллекции:', allScents.length);
            
        } catch (error) {
            console.error('Ошибка загрузки ароматов:', error);
            allScents = [];
        }
        resolve();
    });
}

    function loadArticlesFromCollection() {
        return new Promise((resolve) => {
            try {
                // Получаем ID статей из коллекции
                const articleIds = getArticleCollection();
                console.log('ID статей в коллекции:', articleIds);
                
                if (articleIds.length === 0) {
                    allArticles = [];
                    console.log('Нет статей в коллекции');
                    resolve();
                    return;
                }
                
                // Получаем все статьи
                const articlesData = getArticlesData();
                
                if (!articlesData || articlesData.length === 0) {
                    console.warn('Нет данных о статьях');
                    allArticles = [];
                    resolve();
                    return;
                }
                
                // Фильтруем только те, что есть в коллекции
                allArticles = articlesData
                    .filter(article => articleIds.includes(article.id))
                    .map(article => ({
                        ...article,
                        collection: true
                    }));
                
                console.log('Загруженные статьи:', allArticles);
                
            } catch (error) {
                console.error('Ошибка загрузки статей:', error);
                allArticles = [];
            }
            resolve();
        });
    }

    // ===== ПОЛУЧЕНИЕ ДАННЫХ ИЗ ДРУГИХ ФАЙЛОВ =====
    function getLibraryData() {
        try {
            // Пытаемся получить из кэша библиотеки
            const libraryCache = localStorage.getItem('scentme_library_cache');
            
            if (libraryCache) {
                const cache = JSON.parse(libraryCache);
                if (cache.oils && cache.perfumes) {
                    // Объединяем масла и парфюмы
                    const allLibraryScents = [
                        ...cache.oils.map(oil => ({ ...oil, type: 'oil' })),
                        ...cache.perfumes.map(perfume => ({ ...perfume, type: 'perfume' }))
                    ];
                    console.log('Библиотека загружена из кэша:', allLibraryScents.length);
                    return allLibraryScents;
                }
            }
            
            // Если нет кэша, возвращаем пустой массив
            console.warn('Кэш библиотеки не найден');
            return [];
            
        } catch (error) {
            console.error('Ошибка получения данных библиотеки:', error);
            return [];
        }
    }

    function getArticlesData() {
        try {
            // Пытаемся получить из кэша статей
            const articlesCache = localStorage.getItem('scentme_articles_cache');
            
            if (articlesCache) {
                const cache = JSON.parse(articlesCache);
                if (cache.articles && Array.isArray(cache.articles)) {
                    console.log('Статьи загружены из кэша:', cache.articles.length);
                    return cache.articles.map(article => ({
                        id: article.id,
                        name: article.title,
                        type: article.tag || 'Статья',
                        tag: article.tag,
                        description: article.preview || '',
                        fullDescription: article.content,
                        date: article.date || 'Недавно',
                        readTime: article.readTime || '5 мин',
                        author: article.author || null,
                        new: true // Все статьи в коллекции считаем новыми
                    }));
                }
            }
            
            // Если нет кэша, возвращаем демо-статьи
            console.warn('Кэш статей не найден, используем демо-данные');
            return getDemoArticles();

    function removeFromCollection(event, itemId, itemType) {
        event.stopPropagation();
        event.preventDefault();
        
        if (itemType === 'scent') {
            removeScentFromCollection(itemId);
        } else if (itemType === 'article') {
            removeArticleFromCollection(itemId);
        }
        
        showNotification('Удалено из коллекции');
        loadCollectionData(); // Перезагружаем данные
    }

    function removeScentFromCollection(scentId) {
        try {
            const savedScents = localStorage.getItem('scentme_collection_scents');
            if (savedScents) {
                const scentIds = JSON.parse(savedScents);
                const newScentIds = scentIds.filter(id => id !== scentId);
                localStorage.setItem('scentme_collection_scents', JSON.stringify(newScentIds));
            }
        } catch (e) {
            console.error('Ошибка удаления аромата:', e);
        }
    }

    function removeArticleFromCollection(articleId) {
        try {
            const articleIds = getArticleCollection();
            const newArticleIds = articleIds.filter(id => id !== articleId);
            localStorage.setItem('scentme_collection_articles', JSON.stringify(newArticleIds));
        } catch (e) {
            console.error('Ошибка удаления статьи:', e);
        }
    }

    function setupSearch() {
        const searchInput = document.getElementById('searchInput');
        if (!searchInput) return;
        
        searchInput.addEventListener('input', function(e) {
            searchQuery = e.target.value.trim();
            filterCollection();

    function filterCollection() {
        if (currentTab === 'scents') {
            filterScents();
        } else {
            filterArticles();
        }
    }

    function filterScents() {
        const grid = document.getElementById('scentsGrid');
        if (!grid) return;
        
        if (!searchQuery) {
            displayScentsCollection();
            return;
        }
        
        const query = searchQuery.toLowerCase();
        const filteredScents = allScents.filter(scent => {
            const searchFields = [
                scent.name?.toLowerCase() || '',
                scent.latin?.toLowerCase() || '',
                scent.description?.toLowerCase() || '',
                ...(scent.tags || []).map(t => t.toLowerCase()),
                ...(scent.benefits || []).map(b => b.toLowerCase()),
                scent.type?.toLowerCase() || ''
            ];
            return searchFields.some(field => field.includes(query));
        });
        
        if (filteredScents.length === 0) {
            grid.innerHTML = createEmptyState('🔍', 'Ароматы не найдены', 'Попробуйте изменить поисковый запрос');
        } else {
            grid.innerHTML = '';
            filteredScents.forEach(scent => {
                const card = createScentCard(scent);
                grid.appendChild(card);
            });
        }
    }

    function filterArticles() {
        const grid = document.getElementById('articlesGrid');
        if (!grid) return;
        
        if (!searchQuery) {
            displayArticlesCollection();
            return;
        }
        
        const query = searchQuery.toLowerCase();
        const filteredArticles = allArticles.filter(article => {
            const searchFields = [
                article.name?.toLowerCase() || '',
                article.type?.toLowerCase() || '',
                article.description?.toLowerCase() || '',
                article.tag?.toLowerCase() || ''
            ];
            return searchFields.some(field => field.includes(query));
        });
        
        if (filteredArticles.length === 0) {
            grid.innerHTML = createEmptyState('🔍', 'Статьи не найдены', 'Попробуйте изменить поисковый запрос');
        } else {
            grid.innerHTML = '';
            filteredArticles.forEach(article => {
                const card = createArticleCard(article);
                grid.appendChild(card);
            });
        }
    }

    function switchTab(tabName) {
        currentTab = tabName;
        
        // Обновляем активные табы
        document.querySelectorAll('.collection-tab').forEach(tab => {
            tab.classList.remove('active');
        });
        document.querySelectorAll('.tab-content').forEach(content => {
            content.classList.remove('active');
        });
        
        const tabElement = document.getElementById(`${tabName}Tab`);
        const contentElement = document.getElementById(`${tabName}TabContent`);
        
        if (tabElement) tabElement.classList.add('active');
        if (contentElement) contentElement.classList.add('active');
        
        // Сбрасываем поиск
        searchQuery = '';
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.value = '';
            deactivateSearch();
        }
        
        // Обновляем отображение
        updateDisplay();
    }

        container.classList.add('active');

        const container = document.getElementById('searchContainer');
        const line = document.getElementById('searchLine');

// ===== ФУНКЦИИ ДЛЯ КАРУСЕЛИ МОДАЛЬНОГО ОКНА =====
let currentModalSlide = 0;
let totalModalSlides = 0;

function initModalCarousel() {
    const slides = document.querySelectorAll('.perfume-carousel-slide');
    const dots = document.querySelectorAll('.perfume-carousel-dot');
    
    totalModalSlides = slides.length;
    currentModalSlide = 0;
    
    // Активируем первый слайд
    if (slides.length > 0) {
        updateModalCarousel();
    }
}

function updateModalCarousel() {
    const slides = document.querySelectorAll('.perfume-carousel-slide');
    const dots = document.querySelectorAll('.perfume-carousel-dot');
    
    // Скрываем все слайды
    slides.forEach(slide => slide.classList.remove('active'));
    dots.forEach(dot => dot.classList.remove('active'));
    
    // Показываем текущий слайд
    if (slides[currentModalSlide]) {
        slides[currentModalSlide].classList.add('active');
    }
    
    if (dots[currentModalSlide]) {
        dots[currentModalSlide].classList.add('active');
    }
}

function nextModalSlide() {
    currentModalSlide = (currentModalSlide + 1) % totalModalSlides;
    updateModalCarousel();
}

function prevModalSlide() {
    currentModalSlide = (currentModalSlide - 1 + totalModalSlides) % totalModalSlides;
    updateModalCarousel();
}

function goToModalSlide(index) {
    if (index >= 0 && index < totalModalSlides) {
        currentModalSlide = index;
        updateModalCarousel();
    }
}

// Обновляем функцию showDetailsModal, чтобы инициализировать карусель
function showDetailsModal(itemId, itemType = 'scent') {
    currentDetailItemId = itemId;
    currentDetailItemType = itemType;
    
    console.log('Открываем детали:', { itemId, itemType });
    
    let item;
    
    if (itemType === 'scent') {
        item = allScents.find(p => p.id === itemId);
    } else {
        item = allArticles.find(a => a.id === itemId);
    }
    
    if (!item) {
        console.error('Объект не найден:', itemId);
        showNotification('Ошибка загрузки данных');
        return;
    }
    
    const modalTitle = document.getElementById('detailsModalTitle');
    const modalContent = document.getElementById('detailsModalContent');
    const modalBtn = document.getElementById('modalCollectionBtn');
    
    if (!modalTitle || !modalContent || !modalBtn) {
        console.error('Элементы модалки не найдены');
        return;
    }
    
    modalTitle.textContent = item.name;
    
    if (itemType === 'scent') {
        if (item.type === 'oil' || item.id <= 100) {
            modalContent.innerHTML = createOilModalContent(item);
        } else {
            modalContent.innerHTML = createPerfumeModalContent(item);
        }
        
        // Инициализируем карусель после добавления HTML
        setTimeout(() => {
            initModalCarousel();
        }, 50);
    } else {
        modalContent.innerHTML = createArticleModalContent(item);
    }
    
    updateModalCollectionButton();
    document.getElementById('detailsModalOverlay').classList.add('active');
}

            <div class="oil-modal-section">
                <h3 class="modal-section-title">Содержание</h3>
                <div class="oil-modal-description">
                    ${article.fullDescription || article.description || 'Полное описание временно недоступно.'}
                </div>
            </div>
        </div>
    `;
}
function removeFromCollectionFromModal() {
    if (currentDetailItemId && currentDetailItemType === 'scent') {
        // Создаем фейковый event для removeFromCollection
        const fakeEvent = {
            stopPropagation: () => {},
            preventDefault: () => {}
        };
        removeFromCollection(fakeEvent, currentDetailItemId, 'scent');
        closeDetailsModal();
    }
}

function removeArticleFromCollectionFromModal() {
    if (currentDetailItemId && currentDetailItemType === 'article') {
        // Создаем фейковый event для removeFromCollection
        const fakeEvent = {
            stopPropagation: () => {},
            preventDefault: () => {}
        };
        removeFromCollection(fakeEvent, currentDetailItemId, 'article');
        closeDetailsModal();
    }
}

    // ===== ОБРАБОТКА КЛАВИШ =====
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeSideMenu();
            
            const searchInput = document.getElementById('searchInput');
            if (searchInput === document.activeElement && !searchInput.value) {
                deactivateSearch();
            }
        }
        
        if (e.ctrlKey && e.key === 'f') {
            e.preventDefault();
            activateSearch();
        }
    });
