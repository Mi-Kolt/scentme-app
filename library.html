<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scentmé - Ароматы и Парфюмы</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        /* ===== СБРОС СТИЛЕЙ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* ===== ОСНОВНЫЕ СТИЛИ (СВЕТЛАЯ ТЕМА) ===== */
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            background: #FFF8ED;
            color: #5C4A36;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        body.dark-theme {
            background: #2A1A0F;
            color: #F4E4A6;
        }
        
        /* ===== ЦВЕТОВАЯ ПАЛИТРА СВЕТЛОЙ ТЕМЫ ===== */
        :root {
            --chocolate: #684627;
            --roasted-peach: #E8A895;
            --whole-wheat: #EFD2B0;
            --milky-coffee: #B59272;
            --cream: #FFE4B8;
            --peony-pink: #E8A8B8;
            --peony-dark-pink: #C97A8D;
            --light-beige: #FFF8ED;
            --border-light: rgba(104, 70, 39, 0.3);
            --shadow-light: rgba(104, 70, 39, 0.1);
            --shadow-medium: rgba(104, 70, 39, 0.2);
        }
        
        /* ===== ЦВЕТОВАЯ ПАЛИТРА ТЕМНОЙ ТЕМЫ ===== */
        .dark-theme {
            --dark-chocolate: #3D1F12;
            --walnut-brown: #584738;
            --sand-beige: #98755B;
            --cream-ivory: #F1EADA;
            --pure-white: #FFFFFF;
            --gold: #D4AF37;
            --light-gold: #F4E4A6;
            --dark-beige: #D8C9B0;
            --warm-gray: #A99E8B;
            
            --chocolate: #F4E4A6;
            --roasted-peach: #D4AF37;
            --whole-wheat: #98755B;
            --milky-coffee: #A99E8B;
            --cream: #F1EADA;
            --peony-pink: #D4AF37;
            --peony-dark-pink: #D4AF37;
            --light-beige: #2A1A0F;
            --border-light: rgba(212, 175, 55, 0.3);
            --shadow-light: rgba(212, 175, 55, 0.1);
            --shadow-medium: rgba(212, 175, 55, 0.2);
        }
        
        /* ===== ФОНЫ ДЛЯ ТЕМ ===== */
        .theme-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -2;
            transition: none !important;
            display: none;
        }
        
        .theme-bg.active {
            display: block;
        }
        
        .theme-bg.dark {
            background: #2A1A0F;
        }
        
        .theme-bg.dark::before,
        .theme-bg.dark::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(65deg, 
                    transparent 28%,
                    rgba(212, 175, 55, 0.08) 29%,
                    rgba(244, 228, 166, 0.15) 32%,
                    rgba(212, 175, 55, 0.08) 35%,
                    transparent 36%);
            mix-blend-mode: screen;
            opacity: 0.6;
        }
        
        .theme-bg.dark::after {
            background-image: 
                linear-gradient(115deg, 
                    transparent 28%,
                    rgba(212, 175, 55, 0.08) 29%,
                    rgba(244, 228, 166, 0.15) 32%,
                    rgba(212, 175, 55, 0.08) 35%,
                    transparent 36%);
        }
        
        .theme-bg.light {
            background: #FFF8ED;
        }
        
        .theme-bg.light::before,
        .theme-bg.light::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(65deg, 
                    transparent 28%,
                    rgba(104, 70, 39, 0.15) 29%,
                    rgba(104, 70, 39, 0.25) 32%,
                    rgba(104, 70, 39, 0.15) 35%,
                    transparent 36%);
            mix-blend-mode: multiply;
            opacity: 0.8;
            filter: blur(0.4px);
        }
        
        .theme-bg.light::after {
            background-image: 
                linear-gradient(115deg, 
                    transparent 28%,
                    rgba(104, 70, 39, 0.15) 29%,
                    rgba(104, 70, 39, 0.25) 32%,
                    rgba(104, 70, 39, 0.15) 35%,
                    transparent 36%);
        }
        
        /* ===== ОСНОВНОЙ КОНТЕЙНЕР ===== */
        .app-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        
        /* ===== ШАПКА ВЕРХНЕГО УРОВНЯ (sticky) ===== */
        .main-header {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-light);
            background: white;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 15px var(--shadow-light);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        
        .dark-theme .main-header {
            background: rgba(30, 23, 18, 0.9);
            backdrop-filter: blur(10px);
            border-bottom-color: rgba(212, 175, 55, 0.2);
        }
        
        /* Кнопка меню */
        .menu-toggle {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--chocolate);
            cursor: pointer;
            padding: 5px;
            opacity: 0.8;
            transition: all 0.3s ease;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }
        
        .menu-toggle:hover {
            opacity: 1;
            background: rgba(104, 70, 39, 0.1);
        }
        
        .dark-theme .menu-toggle:hover {
            background: rgba(212, 175, 55, 0.1);
        }
        
        /* Заголовок */
        .main-title {
            font-size: 20px;
            color: var(--chocolate);
            font-weight: 300;
            font-family: 'Georgia', serif;
            letter-spacing: 1px;
        }
        
        /* Аватар профиля */
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            opacity: 0.8;
            transition: opacity 0.3s ease;
            position: relative;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .profile-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--roasted-peach), var(--whole-wheat));
            color: var(--chocolate);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            border: 1px solid var(--border-light);
            box-shadow: 0 2px 8px var(--shadow-light);
            transition: all 0.3s ease;
        }
        
        .profile-btn:hover .profile-avatar {
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--shadow-medium);
        }
        
        /* ===== ПАНЕЛЬ УПРАВЛЕНИЯ ===== */
        .control-panel {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            border-bottom: 1px solid var(--border-light);
            background: white;
            box-shadow: 0 1px 10px var(--shadow-light);
            gap: 12px;
            height: 50px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        
        .dark-theme .control-panel {
            background: rgba(30, 23, 18, 0.9);
            backdrop-filter: blur(10px);
            border-bottom-color: rgba(212, 175, 55, 0.2);
        }
        
        /* Фильтр */
        .filter-section {
            display: flex;
            align-items: center;
            height: 38px;
        }
        
        .filter-btn {
            background: none;
            border: 1px solid var(--border-light);
            border-radius: 10px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            color: var(--chocolate);
            flex-shrink: 0;
            padding: 0;
        }
        
        .filter-btn:hover {
            background: rgba(104, 70, 39, 0.1);
            border-color: var(--chocolate);
        }
        
        .dark-theme .filter-btn:hover {
            background: rgba(212, 175, 55, 0.1);
        }
        
        .filter-icon {
            font-size: 18px;
            color: var(--chocolate);
            opacity: 0.8;
            transition: all 0.3s ease;
        }
        
        .filter-btn:hover .filter-icon {
            opacity: 1;
            transform: scale(1.1);
        }
        
        .filter-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--peony-pink);
            color: white;
            font-size: 10px;
            min-width: 16px;
            height: 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            border: 2px solid white;
            z-index: 1;
        }
        
        /* Поиск */
        .search-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: flex-end;
            height: 38px;
            cursor: pointer;
            min-width: 0;
            padding-bottom: 0;
        }
        
        .search-magnifier {
            position: absolute;
            right: 0;
            bottom: 1px;
            width: 20px;
            height: 20px;
            z-index: 2;
            pointer-events: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .search-magnifier::before {
            content: "";
            position: absolute;
            width: 14px;
            height: 14px;
            border: 2px solid var(--border-light);
            border-radius: 50%;
            top: 0;
            left: 0;
            opacity: 0.8;
            transition: all 0.3s ease;
        }
        
        .search-magnifier::after {
            content: "";
            position: absolute;
            width: 8px;
            height: 2px;
            background: var(--border-light);
            transform: rotate(45deg);
            top: 14px;
            left: 11px;
            opacity: 0.8;
            transition: all 0.3s ease;
        }
        
        .search-line {
            flex: 1;
            height: 1.5px;
            background: var(--border-light);
            position: relative;
            transition: all 0.3s ease;
            margin-right: 25px;
            margin-left: 0;
            align-self: flex-end;
            margin-bottom: 0;
        }
        
        .search-line.active {
            height: 2px;
            background: var(--chocolate);
        }
        
        .search-container.active .search-magnifier::before {
            border-color: var(--chocolate);
            opacity: 1;
        }
        
        .search-container.active .search-magnifier::after {
            background: var(--chocolate);
            opacity: 1;
        }
        
        .search-input {
            position: absolute;
            bottom: 6px;
            left: 0;
            right: 25px;
            padding: 0;
            background: transparent;
            border: none;
            font-size: 14px;
            color: var(--chocolate);
            opacity: 0;
            transform: translateY(2px);
            pointer-events: none;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', system-ui, sans-serif;
            z-index: 100;
            outline: none;
        }
        
        .search-input.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }
        
        .search-input::placeholder {
            color: var(--milky-coffee);
            opacity: 0.7;
        }
        
        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
            background: var(--light-beige);
            transition: background-color 0.3s ease;
        }
        
        /* Кастомный скроллбар в цветовой гамме */
        .content-area::-webkit-scrollbar {
            width: 8px;
        }
        
        .content-area::-webkit-scrollbar-track {
            background: rgba(232, 168, 149, 0.1);
            border-radius: 4px;
            margin: 5px;
        }
        
        .content-area::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--roasted-peach), var(--milky-coffee));
            border-radius: 4px;
            border: 2px solid var(--light-beige);
        }
        
        .content-area::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, var(--milky-coffee), var(--roasted-peach));
        }
        
        .dark-theme .content-area::-webkit-scrollbar-track {
            background: rgba(212, 175, 55, 0.1);
        }
        
        .dark-theme .content-area::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--gold), var(--milky-coffee));
        }
        
        .dark-theme .content-area::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, var(--milky-coffee), var(--gold));
        }
        
        /* Сетка карточек */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* ===== КАРТОЧКИ МАСЕЛ ===== */
        .oil-card-container {
            width: 100%;
            max-width: 320px;
            height: 450px;
            perspective: 1000px;
            margin: 0 auto;
        }
        
        .oil-card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(50, 50, 93, 0.1), 0 5px 15px rgba(0, 0, 0, 0.07);
        }
        
        .oil-card.flipped {
            transform: rotateY(180deg);
        }
        
        .oil-card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .category-universal .oil-card-front,
        .category-universal .oil-card-back {
            border: 2px solid var(--milky-coffee);
        }
        
        .category-rare .oil-card-front,
        .category-rare .oil-card-back {
            border: 2px solid var(--chocolate);
        }
        
        .category-legendary .oil-card-front,
        .category-legendary .oil-card-back {
            border: 2px solid var(--peony-dark-pink);
        }
        
        /* ТЁМНАЯ ТЕМА: границы карточек */
        .dark-theme .category-universal .oil-card-front,
        .dark-theme .category-universal .oil-card-back {
            border: 2px solid var(--cream-ivory);
        }
        
        .dark-theme .category-rare .oil-card-front,
        .dark-theme .category-rare .oil-card-back {
            border: 2px solid var(--walnut-brown);
        }
        
        .dark-theme .category-legendary .oil-card-front,
        .dark-theme .category-legendary .oil-card-back {
            border: 2px solid var(--gold);
        }
        
        .oil-card-back {
            transform: rotateY(180deg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            background: white;
        }
        
        .dark-theme .oil-card-back {
            background: rgba(30, 23, 18, 0.9);
        }
        
        .oil-card-image {
            height: 80%;
            background-size: cover;
            background-position: center;
            position: relative;
            background-color: #f5f1e9;
        }
        
        .oil-collection-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
        }
        
        .oil-heart-icon {
            font-size: 36px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-block;
            line-height: 1;
        }
        
        .oil-heart-icon.empty {
            color: rgba(104, 70, 39, 0.3);
            opacity: 0.5;
        }
        
        .dark-theme .oil-heart-icon.empty {
            color: rgba(212, 175, 55, 0.3);
        }
        
        .oil-heart-icon.filled {
            color: var(--peony-dark-pink);
            transform: scale(1.2);
        }
        
        .dark-theme .oil-heart-icon.filled {
            color: var(--gold);
        }
        
        .oil-card-title {
            height: 20%;
            padding: 10px 20px 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: white;
        }
        
        .dark-theme .oil-card-title {
            background: rgba(30, 23, 18, 0.9);
        }
        
        .oil-card-name {
            font-size: 24px;
            font-weight: 700;
            color: var(--chocolate);
            margin-bottom: 3px;
            text-align: center;
            line-height: 1.1;
        }
        
        .oil-card-latin {
            font-size: 14px;
            font-style: italic;
            color: var(--milky-coffee);
            margin-bottom: 5px;
            text-align: center;
        }
        
        .oil-back-content {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .oil-back-header {
            margin-bottom: 15px;
            text-align: center;
            flex-shrink: 0;
        }
        
        .oil-back-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--chocolate);
            margin-bottom: 3px;
            text-align: center;
        }
        
        .oil-back-category {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(232, 168, 149, 0.2);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--chocolate);
            margin-bottom: 5px;
            text-align: center;
        }
        
        .dark-theme .oil-back-category {
            background: rgba(212, 175, 55, 0.2);
        }
        
        .oil-back-content-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        
        .oil-back-description {
            color: var(--chocolate);
            line-height: 1.5;
            font-size: 15px;
            text-align: justify;
            text-justify: inter-word;
            margin-bottom: 20px;
            flex-shrink: 0;
            font-weight: 400;
        }
        
        .oil-properties-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        
        .oil-property {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 32px;
        }
        
        .oil-property-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--chocolate);
            flex-shrink: 0;
            border: 1.5px solid var(--chocolate);
            box-shadow: none;
        }
        
        .oil-property-text {
            font-size: 13px;
            color: var(--chocolate);
            text-align: left;
            line-height: 1.2;
            font-weight: 500;
            flex: 1;
        }
        
        .oil-details-btn-back {
            display: block;
            width: 85%;
            padding: 12px;
            background: linear-gradient(135deg, var(--roasted-peach) 0%, var(--whole-wheat) 100%);
            color: var(--chocolate);
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            text-decoration: none;
            margin-top: auto;
            margin-left: auto;
            margin-right: auto;
            flex-shrink: 0;
        }
        
        .oil-details-btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(50, 50, 93, 0.1), 0 3px 6px rgba(0, 0, 0, 0.08);
        }
        
        /* ===== КАРТОЧКИ ПАРФЮМОВ ===== */
        .perfume-card-container {
            width: 100%;
            max-width: 320px;
            height: 450px;
            perspective: 1000px;
            margin: 0 auto;
        }
        
        .perfume-card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(50, 50, 93, 0.1), 0 5px 15px rgba(0, 0, 0, 0.07);
        }
        
        .perfume-card.flipped {
            transform: rotateY(180deg);
        }
        
        .perfume-card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .perfume-card-front,
        .perfume-card-back {
            border: 2px solid var(--milky-coffee);
        }
        
        .perfume-category-rare .perfume-card-front,
        .perfume-category-rare .perfume-card-back {
            border: 2px solid var(--chocolate);
        }
        
        .perfume-category-legendary .perfume-card-front,
        .perfume-category-legendary .perfume-card-back {
            border: 2px solid var(--peony-dark-pink);
        }
        
        /* ТЁМНАЯ ТЕМА: границы парфюмов */
        .dark-theme .perfume-card-front,
        .dark-theme .perfume-card-back {
            border: 2px solid var(--cream-ivory);
        }
        
        .dark-theme .perfume-category-rare .perfume-card-front,
        .dark-theme .perfume-category-rare .perfume-card-back {
            border: 2px solid var(--walnut-brown);
        }
        
        .dark-theme .perfume-category-legendary .perfume-card-front,
        .dark-theme .perfume-category-legendary .perfume-card-back {
            border: 2px solid var(--gold);
        }
        
        .perfume-card-back {
            transform: rotateY(180deg);
            padding: 0;
            display: flex;

// ===== ФУНКЦИИ СИСТЕМЫ КОЛЛЕКЦИЙ =====
function addToCollection(productId, productType = 'scent') {
    let collection = getCollection(productType);
    
    if (!collection.includes(productId)) {
        collection.push(productId);
        saveCollection(productType, collection);
        console.log(`✅ Добавлен в коллекцию: ${productId}`);
        
        saveProductData(productId, productType);
        
        updateCollectionCount();
        return true;
    }
    return false;
}

function removeFromCollection(productId, productType = 'scent') {
    let collection = getCollection(productType);
    
    const index = collection.indexOf(productId);
    if (index !== -1) {
        collection.splice(index, 1);
        saveCollection(productType, collection);
        console.log(`❌ Удален из коллекции: ${productId}`);
        
        removeProductData(productId, productType);
        
        updateCollectionCount();
        return true;
    }
    return false;
}

function isInCollection(productId, productType = 'scent') {
    const collection = getCollection(productType);
    return collection.includes(productId);
}

function getCollection(productType = 'scent') {
    const key = `scentme_collection_${productType}s`;
    const collection = localStorage.getItem(key);
    return collection ? JSON.parse(collection) : [];
}

function saveCollection(productType = 'scent', collection) {
    const key = `scentme_collection_${productType}s`;
    localStorage.setItem(key, JSON.stringify(collection));
}

function saveProductData(productId, productType = 'scent') {
    let productData = null;
    
    if (productType === 'scent') {
        productData = allProducts.find(p => p.id === productId);
    }
    
    if (productData) {
        const key = `scentme_product_${productType}_${productId}`;
        localStorage.setItem(key, JSON.stringify(productData));
    }
}

function removeProductData(productId, productType = 'scent') {
    const key = `scentme_product_${productType}_${productId}`;
    localStorage.removeItem(key);
}

function updateCollectionCount() {
    const scentCollection = getCollection('scent');
    const articleCollection = getCollection('article');
    const totalCount = scentCollection.length + articleCollection.length;
    
    const countElement = document.getElementById('collectionCount');
    if (countElement) {
        countElement.textContent = totalCount > 0 ? `(${totalCount})` : '';
    }
}

function checkCollectionOnLoad() {
    console.log('🔍 Проверяем коллекцию при загрузке...');
    
    try {
        const scentCollection = getCollection('scent');
        const articleCollection = getCollection('article');
        
        console.log(`📚 Коллекция ароматов: ${scentCollection.length} шт`);
        console.log(`📰 Коллекция статей: ${articleCollection.length} шт`);
        
        allProducts.forEach(product => {
            const isInCollection = scentCollection.includes(product.id);
            product.collection = isInCollection;
            
            if (isInCollection) {
                const savedKey = `scentme_product_scent_${product.id}`;
                const savedData = localStorage.getItem(savedKey);
                if (savedData) {
                    try {
                        const productData = JSON.parse(savedData);
                        Object.assign(product, productData);
                    } catch (e) {
                        console.error(`❌ Ошибка парсинга данных:`, e);
                    }
                }
            }
        });
        
        console.log('✅ Проверка коллекции завершена');
        
    } catch (error) {
        console.error('❌ Ошибка при проверке коллекции:', error);
    }
}

// ===== ФУНКЦИИ ТЕМЫ =====
function loadUserTheme() {
    try {
        const currentUserId = localStorage.getItem('current_user');
        if (!currentUserId) return;
        
        const usersJson = localStorage.getItem('scentme_users');
        if (!usersJson) return;
        
        const users = JSON.parse(usersJson);
        const user = users.find(u => u.id === currentUserId);
        
        if (user && user.settings && user.settings.theme) {
            applyTheme(user.settings.theme);
        } else {
            applyTheme('dark');
        }
    } catch (error) {
        console.error('Ошибка загрузки темы:', error);
        applyTheme('dark');
    }
}

function applyTheme(theme) {
    const body = document.body;
    const darkBg = document.querySelector('.theme-bg.dark');
    const lightBg = document.querySelector('.theme-bg.light');
    
    if (theme === 'light') {
        body.classList.remove('dark-theme');
        darkBg.classList.remove('active');
        lightBg.classList.add('active');
        localStorage.setItem('scentme_theme', 'light');
    } else {
        body.classList.add('dark-theme');
        lightBg.classList.remove('active');
        darkBg.classList.add('active');
        localStorage.setItem('scentme_theme', 'dark');
    }
    
    saveUserTheme(theme);
}

function saveUserTheme(theme) {
    try {
        const currentUserId = localStorage.getItem('current_user');
        if (!currentUserId) return;
        
        const usersJson = localStorage.getItem('scentme_users');
        if (!usersJson) return;
        
        const users = JSON.parse(usersJson);
        const userIndex = users.findIndex(u => u.id === currentUserId);
        
        if (userIndex !== -1) {
            if (!users[userIndex].settings) {
                users[userIndex].settings = {};
            }
            users[userIndex].settings.theme = theme;
            localStorage.setItem('scentme_users', JSON.stringify(users));
        }
    } catch (error) {
        console.error('Ошибка сохранения темы:', error);
    }
}

function checkAuthentication() {
    const currentUserId = localStorage.getItem('current_user');
    
    // Если пользователя нет, создаем гостевую сессию
    if (!currentUserId) {
        const guestId = 'guest_' + Date.now();
        localStorage.setItem('current_user', guestId);
        
        // Создаем запись для гостя в общем хранилище пользователей
        const usersJson = localStorage.getItem('scentme_users') || '[]';
        const users = JSON.parse(usersJson);
        
        const existingGuest = users.find(u => u.id === guestId);
        if (!existingGuest) {
            users.push({
                id: guestId,
                displayName: 'Гость',
                email: '',
                registrationDate: new Date().toISOString(),
                settings: {
                    theme: localStorage.getItem('scentme_theme') || 'dark'
                },
                isGuest: true
            });
            localStorage.setItem('scentme_users', JSON.stringify(users));
        }
    }
    
    updateUserAvatar();
}

function updateUserAvatar() {
    try {
        const currentUserId = localStorage.getItem('current_user');
        if (!currentUserId) return;
        
        const usersJson = localStorage.getItem('scentme_users');
        if (!usersJson) return;
        
        const users = JSON.parse(usersJson);
        const user = users.find(u => u.id === currentUserId);
        
        if (user && user.displayName) {
            const firstLetter = user.displayName.charAt(0).toUpperCase();
            const avatar = document.getElementById('headerAvatar');
            if (avatar) {
                avatar.textContent = firstLetter;
            }
        }
    } catch (error) {
        console.error('Ошибка обновления аватара:', error);
    }
}

function toggleCollection(event, productId) {
    event.stopPropagation();
    event.preventDefault();
    
    const product = allProducts.find(p => p.id === productId);
    if (!product) {
        console.error('Продукт не найден:', productId);
        return;
    }
    
    const wasInCollection = product.collection;
    
    if (wasInCollection) {
        removeFromCollection(productId, 'scent');
        product.collection = false;
        showNotification(`${product.name} удален(а) из коллекции`);
    } else {
        addToCollection(productId, 'scent');
        product.collection = true;
        showNotification(`${product.name} добавлен(а) в коллекцию`);
    }
    
    // Обновляем иконку на карточке
    updateHeartIcon(productId, product.collection);
    
    // Обновляем кнопку в модалке если она открыта
    if (currentDetailProductId === productId) {
        updateModalCollectionButton();
    }
}

function updateHeartIcon(productId, isInCollection) {
    const card = document.querySelector(`#card-${productId}`);
    if (!card) return;
    
    let heartIcon;
    if (productId <= 13) {
        heartIcon = card.querySelector('.oil-heart-icon');
    } else {
        heartIcon = card.querySelector('.perfume-heart-icon');
    }
    
    if (heartIcon) {
        heartIcon.className = isInCollection ? 
            (productId <= 13 ? 'oil-heart-icon filled' : 'perfume-heart-icon filled') : 
            (productId <= 13 ? 'oil-heart-icon empty' : 'perfume-heart-icon empty');
        
        heartIcon.style.animation = 'none';
        setTimeout(() => {
            heartIcon.style.animation = 'heartBeat 0.3s ease-in-out';
        }, 10);
    }
}
function addToCollectionFromModal() {
    if (currentDetailProductId) {
        const product = allProducts.find(p => p.id === currentDetailProductId);
        if (product) {
            product.collection = !product.collection;
            
            let heartIcon;
            if (currentDetailProductType === 'oil') {
                heartIcon = document.querySelector(`#card-${currentDetailProductId} .oil-heart-icon`);
            } else {
                heartIcon = document.querySelector(`#card-${currentDetailProductId} .perfume-heart-icon`);
            }
            
            if (heartIcon) {
                heartIcon.classList.toggle('empty');
                heartIcon.classList.toggle('filled');
                
                heartIcon.style.animation = 'none';
                setTimeout(() => {
                    heartIcon.style.animation = 'heartBeat 0.3s ease-in-out';
                }, 10);
            }
            
            if (product.collection) {
                addToCollection(currentDetailProductId, 'scent');
                showNotification(`${product.name} добавлен(а) в коллекцию`);
            } else {
                removeFromCollection(currentDetailProductId, 'scent');
                showNotification(`${product.name} удален(а) из коллекции`);
            }
            
            updateModalCollectionButton();
            
            if (currentFilters.sortBy === 'collection') {
                filterProducts();
                sortProducts();
                renderCards();
            }
        }
    }
}

function updateModalCollectionButton() {

function toggleFilter(filterType, value) {
    const index = currentFilters[filterType].indexOf(value);
    if (index === -1) {
        currentFilters[filterType].push(value);
    } else {
        currentFilters[filterType].splice(index, 1);
    }
    
    // Перерендериваем конкретный фильтр
    switch(filterType) {
        case 'categories': renderCategoryFilters(); break;
        case 'productTypes': renderProductTypeFilters(); break;
        case 'aromaTypes': renderAromaTypeFilters(); break;
        case 'genders': renderGenderFilters(); break;
        case 'seasons': renderSeasonFilters(); break;
        case 'dayTimes': renderDayTimeFilters(); break;
        case 'longevity': renderLongevityFilters(); break;
        case 'benefits': renderBenefitFilters(); break;
        case 'moods': renderMoodFilters(); break;
    }
    
    updateFilterBadge();
}

function filterProducts() {
    filteredProducts = allProducts.filter(product => {
        const isOil = product.id <= 13;
        const productType = isOil ? 'oil' : 'perfume';
        
        // Поиск
        if (searchQuery) {
            const query = searchQuery.toLowerCase();
            const searchFields = [
                product.name.toLowerCase(),
                ...(product.latin ? [product.latin.toLowerCase()] : []),
                product.description.toLowerCase(),
                ...(product.tags ? product.tags.map(t => t.toLowerCase()) : [])
            ];
            
            if (!searchFields.some(field => field.includes(query))) {
                return false;
            }
        }
        
        // Фильтр по типу продукта
        if (currentFilters.productTypes.length > 0) {
            if (!currentFilters.productTypes.includes(productType)) {
                return false;
            }
        }
        
        // Фильтр по категории
        if (currentFilters.categories.length > 0) {
            if (!currentFilters.categories.includes(product.category)) {
                return false;
            }
        }
        
        // Фильтр по типу аромата
        if (currentFilters.aromaTypes.length > 0) {
            if (isOil) {
                // Для масел проверяем теги
                const hasAromaType = currentFilters.aromaTypes.some(type => {
                    return product.tags && product.tags.some(tag => 
                        tag.toLowerCase().includes(aromaTypes.find(a => a.id === type)?.name.toLowerCase())
                    );
                });
                if (!hasAromaType) return false;
            } else {
                // Для парфюмов проверяем тип
                if (!currentFilters.aromaTypes.includes(product.type.toLowerCase())) {
                    return false;
                }
            }
        }
        
        // Фильтр по полезным свойствам (для масел)
        if (currentFilters.benefits.length > 0 && isOil) {
            const hasBenefit = currentFilters.benefits.some(benefitId => {
                const benefitName = oilBenefits.find(b => b.id === benefitId)?.name;
                return benefitName && product.benefits?.includes(benefitName);
            });
            if (!hasBenefit) return false;
        }
        
        // Фильтр по настроению
        if (currentFilters.moods.length > 0) {
            const hasMood = currentFilters.moods.some(moodId => {
                const moodName = moodTypes.find(m => m.id === moodId)?.name;
                return moodName && product.tags?.some(tag => tag.toLowerCase().includes(moodName.toLowerCase()));
            });
            if (!hasMood) return false;
        }
        
        // Фильтр по стойкости
        if (currentFilters.longevity.length > 0) {
            if (isOil) {
                // Для масел проверяем теги
                const hasLongevity = currentFilters.longevity.some(longevityId => {
                    const longevityName = longevityRanges.find(l => l.id === longevityId)?.name;
                    return longevityName && product.tags?.some(tag => tag.toLowerCase().includes(longevityName.toLowerCase()));
                });
                if (!hasLongevity) return false;
            } else {
                // Для парфюмов проверяем числовое значение
                const productLongevity = parseInt(product.longevity);
                const hasLongevity = currentFilters.longevity.some(longevityId => {
                    const range = longevityRanges.find(l => l.id === longevityId);
                    if (!range || !range.min || !range.max) return false;
                    return productLongevity >= range.min && productLongevity <= range.max;
                });
                if (!hasLongevity) return false;
            }
        }
        
        return true;
    });
}

function sortProducts() {
    switch (currentFilters.sortBy) {
        case 'name-asc':
            filteredProducts.sort((a, b) => a.name.localeCompare(b.name));
            break;
        case 'name-desc':
            filteredProducts.sort((a, b) => b.name.localeCompare(a.name));
            break;
        case 'category':
            filteredProducts.sort((a, b) => {
                const catA = categories.findIndex(cat => cat.id === a.category);
                const catB = categories.findIndex(cat => cat.id === b.category);
                return catA - catB;
            });
            break;
        case 'longevity-asc':
            filteredProducts.sort((a, b) => {
                const longevityA = parseInt(a.longevity) || 0;
                const longevityB = parseInt(b.longevity) || 0;
                return longevityA - longevityB;
            });
            break;
        case 'longevity-desc':
            filteredProducts.sort((a, b) => {
                const longevityA = parseInt(a.longevity) || 0;
                const longevityB = parseInt(b.longevity) || 0;
                return longevityB - longevityA;
            });
            break;
        case 'type':
            filteredProducts.sort((a, b) => {
                const typeA = a.type || '';
                const typeB = b.type || '';
                return typeA.localeCompare(typeB);
            });
            break;
        case 'product-type':
            filteredProducts.sort((a, b) => {
                const typeA = a.id <= 13 ? 'oil' : 'perfume';
                const typeB = b.id <= 13 ? 'oil' : 'perfume';
                return typeA.localeCompare(typeB);
            });
            break;
        case 'collection':
            filteredProducts.sort((a, b) => b.collection - a.collection);
            break;
        case 'popularity':
            // Пока нет данных о популярности, сортируем по id
            filteredProducts.sort((a, b) => a.id - b.id);
            break;
    }
}

        cardsGrid.innerHTML = `
            <div class="empty-state">
                <div class="empty-state-icon">🌿</div>

                <div class="perfume-carousel-dot ${index === 0 ? 'active' : ''}" 
                     data-index="${index}"></div>
            `;
        });
    }
    
    let storesHTML = '';
    if (product.stores && product.stores.length > 0) {
        storesHTML = product.stores.map(store => `
            <span class="perfume-store-badge">${store}</span>
        `).join('');
    }
    
    return `
        <div class="perfume-modal-content">
            <div class="perfume-carousel-section">
                <div class="perfume-carousel-container" id="perfumeCarousel">
                    ${imagesHTML}
                    ${product.images && product.images.length > 1 ? `
                        <button class="perfume-carousel-btn prev" onclick="prevCarouselSlide()">‹</button>
                        <button class="perfume-carousel-btn next" onclick="nextCarouselSlide()">›</button>

            </div>
            
            <div class="perfume-info-section">

                    <div class="perfume-info-block">
                        <h3>Пирамида аромата</h3>
                        <div class="perfume-modal-pyramid-container">
                            <div class="perfume-modal-pyramid-layer perfume-modal-pyramid-top">
                                <div class="perfume-modal-pyramid-label">Верхние ноты</div>
                                <div class="perfume-modal-pyramid-notes">${product.notes.top}</div>
                            </div>
                            
                            <div class="perfume-modal-pyramid-layer perfume-modal-pyramid-heart">
                                <div class="perfume-modal-pyramid-label">Ноты сердца</div>
                                <div class="perfume-modal-pyramid-notes">${product.notes.heart}</div>
                            </div>
                            
                            <div class="perfume-modal-pyramid-layer perfume-modal-pyramid-base">
                                <div class="perfume-modal-pyramid-label">Базовые ноты</div>
                                <div class="perfume-modal-pyramid-notes">${product.notes.base}</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="perfume-info-column">
                    <div class="perfume-info-block">
                        <h3>Характеристики</h3>
                        <div class="perfume-specs-grid">
                            <div class="perfume-spec-item">
                                <div class="perfume-spec-label">Тип</div>
                                <div class="perfume-spec-value">${product.details.type}</div>
                            </div>
                            <div class="perfume-spec-item">
                                <div class="perfume-spec-label">Объем</div>
                                <div class="perfume-spec-value">${product.details.volume}</div>
                            </div>
                            <div class="perfume-spec-item">
                                <div class="perfume-spec-label">Сезон</div>
                                <div class="perfume-spec-value">${product.details.season}</div>
                            </div>
                            <div class="perfume-spec-item">
                                <div class="perfume-spec-label">Время</div>
                                <div class="perfume-spec-value">${product.details.time}</div>
                            </div>
                            <div class="perfume-spec-item">

                            </div>

                                <div class="perfume-spec-value">${product.longevity} ч</div>
                            </div>

                    </div>
                    
                    ${storesHTML ? `
                    <div class="perfume-info-block">
                        <h3>Где купить</h3>
                        <div class="perfume-stores-block">
                            <div class="perfume-stores-list">
                                ${storesHTML}
                            </div>
                        </div>
                    </div>
                    ` : ''}
                </div>
            </div>
        </div>
    `;
}

// ===== КАРУСЕЛЬ В МОДАЛКЕ =====
let currentCarouselSlide = 0;

function prevCarouselSlide() {
    const slides = document.querySelectorAll('.perfume-carousel-slide');
    const dots = document.querySelectorAll('.perfume-carousel-dot');
    
    if (slides.length === 0) return;
    
    currentCarouselSlide = (currentCarouselSlide - 1 + slides.length) % slides.length;
    
    slides.forEach((slide, index) => {
        slide.classList.toggle('active', index === currentCarouselSlide);
    });
    
    dots.forEach((dot, index) => {
        dot.classList.toggle('active', index === currentCarouselSlide);
    });
}

function nextCarouselSlide() {
    const slides = document.querySelectorAll('.perfume-carousel-slide');
    const dots = document.querySelectorAll('.perfume-carousel-dot');
    
    if (slides.length === 0) return;
    
    currentCarouselSlide = (currentCarouselSlide + 1) % slides.length;
    
    slides.forEach((slide, index) => {
        slide.classList.toggle('active', index === currentCarouselSlide);
    });
    
    dots.forEach((dot, index) => {
        dot.classList.toggle('active', index === currentCarouselSlide);
    });
}

// Инициализация карусели при открытии модалки
document.addEventListener('click', function(e) {
    if (e.target.classList.contains('perfume-carousel-dot')) {
        const index = parseInt(e.target.dataset.index);
        currentCarouselSlide = index;
        
        const slides = document.querySelectorAll('.perfume-carousel-slide');
        const dots = document.querySelectorAll('.perfume-carousel-dot');
        
        slides.forEach((slide, i) => {
            slide.classList.toggle('active', i === index);
        });
        
        dots.forEach((dot, i) => {
            dot.classList.toggle('active', i === index);
        });
    }
});

// ===== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =====
function showNotification(text) {
    const notification = document.getElementById('notification');
    const notificationText = document.getElementById('notificationText');
    
    notificationText.textContent = text;
    notification.classList.add('show');
    
    setTimeout(() => {
        notification.classList.remove('show');
    }, 3000);
}
// Добавить в конец скрипта main.html
function syncCollectionToCache() {
    try {
        const scentIds = getCollection('scent');
        const scentData = allProducts
            .filter(product => scentIds.includes(product.id))
            .map(product => ({
                id: product.id,
                name: product.name,
                type: product.id <= 13 ? 'oil' : 'perfume',
                category: product.category,
                image: product.image,
                description: product.description,
                tags: product.tags || [],
                benefits: product.benefits || [],
                notes: product.notes || null,
                longevity: product.longevity || null,
                latin: product.latin || null
            }));
        
        localStorage.setItem('scentme_library_cache', JSON.stringify({
            oils: scentData.filter(s => s.type === 'oil'),
            perfumes: scentData.filter(s => s.type === 'perfume')
        }));
        
        console.log('Кэш библиотеки обновлен:', scentData.length);
    } catch (error) {
        console.error('Ошибка синхронизации кэша:', error);
    }
}

// Обновить функции addToCollection и removeFromCollection в main.html:
function addToCollection(productId, productType = 'scent') {
    let collection = getCollection(productType);
    
    if (!collection.includes(productId)) {
        collection.push(productId);
        saveCollection(productType, collection);
        console.log(`✅ Добавлен в коллекцию: ${productId}`);
        
        // Синхронизируем с кэшем
        syncCollectionToCache();
        
        updateCollectionCount();
        return true;
    }
    return false;
}

function removeFromCollection(productId, productType = 'scent') {
    let collection = getCollection(productType);
    
    const index = collection.indexOf(productId);
    if (index !== -1) {
        collection.splice(index, 1);
        saveCollection(productType, collection);
        console.log(`❌ Удален из коллекции: ${productId}`);
        
        // Синхронизируем с кэшем
        syncCollectionToCache();
        
        updateCollectionCount();
        return true;
    }
    return false;
}

filterProducts();
sortProducts();
renderCards();
